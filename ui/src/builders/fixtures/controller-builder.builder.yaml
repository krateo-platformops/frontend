# The Controller Builder, DECLARED — the third builder, the first written for the engine rather than
# migrated onto it (T3, frontend#409; the Builder CR the approved mockup shows, frontend#406).
#
# THE ENGINE READS THIS: builderRegistry.ts loads it beside the page and blueprint Builders, so a
# controller draft is held, autosaved as `draft-controller-<owner>-<slug>`, resumed and discarded by
# the same engine code, and `publishRestDef` is this Builder's publish verb. What is NOT here yet is
# the composer: its palette, canvas and inspector plugins are named, and pluginRegistry.ts lists them
# as PENDING — a refusal that says they ship with the Controller Builder (T8) — until T8 mounts them.
# There is no /controller-builder/compose route either until then; builderFixtures.test.ts says so.
apiVersion: builders.templates.krateo.io/v1alpha1
kind: Builder
metadata:
  name: controller-builder
spec:
  label: Controller Builder
  # T8 registers the route; until then the composer is not served (builderFixtures.test.ts).
  route: /controller-builder/compose
  # draftRecord.ts: `draft-controller-<owner>-<slug>`, label krateo.io/draft-kind=controller. The
  # portal's my-drafts lists it (portal.draftBuilders, portal#274).
  draftKind: controller
  # The mockup's start modal: a name, an API group, and the OpenAPI document (pasted, uploaded or by
  # URL). Over the cap, the modal offers to trim the spec to the mapped paths or reference it by URL.
  start:
    fields:
      - name: name
        label: Controller name
        required: true
        help: Lower-case, dashes. It becomes the chart, the repository and the CompositionDefinition name.
        placeholder: github-provider
      - name: apiGroup
        label: API group
        required: true
        help: The group of the Kinds the controller serves.
        placeholder: github.ogen.krateo.io
      - name: spec
        label: OpenAPI document
        required: true
        help: Paste it, upload it, or give its URL.
      - name: baseUrl
        label: Base URL
        required: false
        help: Overrides the document's servers entry.
        placeholder: https://api.github.com
    # blueprintDraftStore.ts BLUEPRINT_DRAFT_MAX_BYTES — the same 512 KiB tree cap as every draft.
    maxDraftBytes: 524288
  # T7's oasImport.ts / paletteModel.ts: the held spec's operations, grouped by resource path.
  palette:
    plugin: openapi
  # The Kinds and their configuration, as a graph.
  canvas:
    plugin: restdef-graph
  # T7's operationMapping.ts / restDefinitionBuild.ts: verbs, identifiers, auth.
  inspector:
    plugin: restdef-mapping
  # frontend#405: a controller preview RENDERS (oasgen-render generates the CRDs), it never applies.
  preview:
    mode: render
    restActionRef:
      name: controller-render-draft
  # A controller is a chart: N RestDefinitions plus the OAS ConfigMaps, seeded from builder-scaffold.
  files:
    required:
      - Chart.yaml
      - values.yaml
      - values.schema.json
    # publishDraft.ts REGISTRATION_PATH — the portal writes it at publish.
    locked:
      - compositiondefinition.yaml
    heldBytes: 524288
  # proposedChart.ts lintHeldDraft(files, 'controller'): the chart lint (identity, schema defaults).
  lint:
    - chart-lint
  gates:
    - preview-before-publish
    - publish-name
  # kogPublish.ts: one BuilderPublish claim, to AUTOPILOT_KOG_BUILDER_REPO, seeded from builder-scaffold.
  publish:
    builder: controller
    targetKey: AUTOPILOT_KOG_BUILDER_REPO
    templateKey: AUTOPILOT_BLUEPRINT_BUILDER_TEMPLATE
    registration:
      kind: CompositionDefinition
      path: compositiondefinition.yaml
  # actionBridge.ts previewRestDef, publishRestDef — publishRestDef is this Builder's, no longer an
  # undeclared publish verb (publishDraft.ts).
  verbs:
    allowed:
      - previewRestDef
      - publishRestDef
  # The portal chart's /controller-builder hub (portal#274).
  portal:
    draftsCard:
      name: controller-builder-drafts-card
