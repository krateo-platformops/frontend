# Composable Form: instead of the schema/stringSchema generator, the Form provides
# the antd Form context + submit and COMPOSES child form-control widgets
# (Input/Select/Switch/...). Each control binds its value by `name`; on submit the
# Form collects them and runs the rest action.
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-form-composable
  namespace: krateo-system
spec:
  widgetData:
    layout: vertical
    submitActionId: submit-form
    items:
      - resourceRefId: field-name
      - resourceRefId: field-environment
      - resourceRefId: field-autosync
    actions:
      rest:
        - id: submit-form
          type: rest
          resourceRefId: create-deployment
          headers:
            - "Content-Type: application/json"
    buttonConfig:
      primary:
        label: Create
  resourcesRefs:
    items:
      - id: field-name
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: field-name
        namespace: krateo-system
        resource: inputs
        verb: GET
      - id: field-environment
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: field-environment
        namespace: krateo-system
        resource: selects
        verb: GET
      - id: field-autosync
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: field-autosync
        namespace: krateo-system
        resource: switches
        verb: GET
      - id: create-deployment
        apiVersion: templates.krateo.io/v1alpha1
        name: create-deployment
        namespace: krateo-system
        resource: restactions
        verb: GET
---
# Schema-driven Form: the fields come from `schema`; the lists beside it configure them by
# name (a dotted path; `hosts.zone` is the zone of every `hosts` row). Each `resourceRefId`
# is one of `resourcesRefs`.
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-form-schema
  namespace: krateo-system
spec:
  widgetData:
    submitActionId: submit-form
    actions:
      rest:
        - id: submit-form
          type: rest
          resourceRefId: create-deployment
          headers:
            - "Content-Type: application/json"
    schema:
      type: object
      required: [region, zone]
      properties:
        region: { type: string, title: Region }
        zone: { type: string, title: Zone }
        owner: { type: string, title: Owner }
        logLevel: { type: string, title: Log level }
        service:
          type: object
          title: Service
          properties:
            type: { type: string, enum: [ClusterIP, NodePort], default: ClusterIP }
            nodePort: { type: integer, title: Node port }
        hosts:
          type: array
          title: Hosts
          items:
            type: object
            properties:
              host: { type: string, title: Host }
              zone: { type: string, title: Row zone }
    autocomplete:
      - name: region
        resourceRefId: regions
        closed: true
        fallback: manual
      - name: owner
        resourceRefId: users
        extra:
          key: q
        minChars: 2
    dependencies:
      - name: zone
        dependsOn:
          name: region
        resourceRefId: zones
        extra:
          key: region
      - name: hosts.zone
        dependsOn:
          name: region
        resourceRefId: zones
        extra:
          key: region
    displayingDependencies:
      - name: service.nodePort
        dependsOn:
          name: service.type
          conditionType: value
          value:
            type: string
            stringValue: NodePort
    objectFields:
      - path: hosts
        displayField: host
    suggestions:
      - name: logLevel
        options:
          - value: debug
          - value: info
          - value: warn
            label: Warning
            description: only problems
  resourcesRefs:
    items:
      - id: regions
        apiVersion: templates.krateo.io/v1
        resource: restactions
        name: regions
        namespace: krateo-system
        verb: GET
      - id: zones
        apiVersion: templates.krateo.io/v1
        resource: restactions
        name: zones
        namespace: krateo-system
        verb: GET
      - id: users
        apiVersion: templates.krateo.io/v1
        resource: restactions
        name: users
        namespace: krateo-system
        verb: GET
      - id: create-deployment
        apiVersion: templates.krateo.io/v1
        resource: restactions
        name: create-deployment
        namespace: krateo-system
        verb: POST
---
# Schema-driven Form with checkboxes and "(optional)" marks. `checkboxes` draws a boolean as a
# Checkbox labelled by its `title`; `link.text` is the phrase of the label that becomes the link.
# A required checkbox must be ticked, and shows `requiredMessage` when it is not.
# `requiredMark: optional` marks every field that is not required "(optional)", in place, and
# `hasFeedback: rules` shows the validation icons on an optional field with a rule (`phone`).
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-form-checkboxes
  namespace: krateo-system
spec:
  widgetData:
    submitActionId: submit-form
    requiredMark: optional
    hasFeedback: rules
    actions:
      rest:
        - id: submit-form
          type: rest
          resourceRefId: create-request
          headers:
            - "Content-Type: application/json"
    schema:
      type: object
      required: [firstName, email, consent]
      properties:
        firstName: { type: string, title: First name }
        email: { type: string, title: Email, pattern: "^[^@ ]+@[^@ ]+$" }
        phone: { type: string, title: Phone, pattern: "^[+][0-9 ]+$" }
        consent:
          type: boolean
          title: I agree that my details are processed to review this request. See the privacy policy.
        updates:
          type: boolean
          title: Send me occasional product updates. I can unsubscribe at any time.
    checkboxes:
      - name: consent
        link:
          text: privacy policy
          href: https://example.com/privacy
        requiredMessage: Please agree to the processing of your details; the request cannot be reviewed without it.
      - name: updates
  resourcesRefs:
    items:
      - id: create-request
        apiVersion: templates.krateo.io/v1
        resource: restactions
        name: create-request
        namespace: krateo-system
        verb: POST
---
# Schema-driven Form that checks a field while it is typed and submits to an intake, not to a
# snowplow /call write. Both send through the page transport's allow-listed POST: the path must be
# under the installation's PUBLIC_POST_PATHS, and no credential is ever sent. `bodyExtras` sends the
# page's fragment extras (here `t`, declared by the page root's `krateo.io/fragment-keys`) in the
# body, never in a URL. Answers and responses are matched in order, first match wins; a network
# error or the timeout is `otherwise`. `fieldHelp` puts help text under the input.
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-form-check-and-post
  namespace: krateo-system
spec:
  widgetData:
    buttonConfig:
      primary:
        label: Reserve
    schema:
      type: object
      required: [handle]
      properties:
        handle: { type: string, title: Handle }
    fieldHelp:
      - name: handle
        text: Lowercase letters and digits. You can't change it later.
    fieldChecks:
      - name: handle
        path: /intake/api/v1/handle-checks
        bodyExtras: { token: t }
        answers:
          - when: { status: [200], bodyField: status, equals: [free] }
            validateStatus: success
            message: "{value} is free."
          - when: { status: [200], bodyField: status, equals: [taken] }
            validateStatus: error
            message: That handle is taken.
          - when: { status: [429] }
            validateStatus: warning
            message: Too many checks. Wait a moment.
            retryAfterMessage: "Too many checks. Try again in {retryAfter}."
        otherwise:
          validateStatus: warning
          message: The handle couldn't be checked right now.
    submitPost:
      path: /intake/api/v1/reservations
      bodyExtras: { token: t }
      responses:
        - when: { status: [201] }
          result:
            status: success
            title: Reserved
            subtitle: "{body.handle} is yours."
            extra:
              - { kind: link, text: "Changed your mind?", label: Start again, href: /public/reserve }
        - when: { status: [400] }
          fieldErrors: { namesFrom: fields, message: Check this field. }
        - when: { status: [429] }
          alert:
            type: warning
            title: Too many requests
            description: Wait a moment and try again.
            retryAfterDescription: "Try again in {retryAfter}."
      otherwise:
        alert: { type: error, title: "The reservation couldn't be sent", description: Try again later. }
---
# Schema-driven Form with the presentation options: a `title` above the fields (it goes when a
# Result replaces the form), no Reset and a full-width large primary button, a multi-line
# `textareas` field, a labelled choice (`oneOf` of `{const, title}`: the titles are shown, the consts
# submitted; `enum` kept beside it must list the same values), a custom required message and no
# required marks.
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-form-presentation
  namespace: krateo-system
spec:
  widgetData:
    title: Open a ticket
    requiredMark: hidden
    buttonConfig:
      primary: { label: Send, block: true, size: large }
      secondary: { hidden: true }
    textareas:
      - { name: description, rows: 5 }
    validationMessages:
      - { name: subject, requiredMessage: Say in a few words what the ticket is about. }
    stringSchema: '{"type":"object","required":["subject","priority","description"],"properties":{"subject":{"type":"string","title":"Subject"},"priority":{"type":"string","title":"Priority","enum":["low","normal","high"],"oneOf":[{"const":"low","title":"Low"},{"const":"normal","title":"Normal"},{"const":"high","title":"High"}]},"description":{"type":"string","title":"Description"}}}'
    submitPost:
      path: /intake/api/v1/tickets
      responses:
        - when: { status: [201] }
          result: { status: success, title: Ticket opened }
---
# Schema-driven Form with the input options: `noticeVariant: text` draws the notice as a muted line
# (it goes with the form when a Result replaces it), `fieldInputs` gives fields a placeholder, an
# HTML input type and an autocomplete token (one of the HTML autofill field names), and
# `hasFeedback: none` turns off the feedback icons. With an input `type`, the form sets novalidate,
# so its own rules report under the fields.
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-form-inputs
  namespace: krateo-system
spec:
  widgetData:
    title: Join the waiting list
    notice: We'll email you when a place opens up.
    noticeVariant: text
    layout: vertical
    requiredMark: optional
    hasFeedback: none
    buttonConfig:
      primary: { label: Join, block: true, size: large }
      secondary: { hidden: true }
    fieldInputs:
      - { name: fullName, autoComplete: name }
      - { name: email, type: email, autoComplete: email, placeholder: jane@example.com }
      - { name: phone, type: tel, autoComplete: tel, placeholder: "+39 …" }
      - { name: country, placeholder: Search for your country }
    stringSchema: '{"type":"object","required":["fullName","email","country"],"properties":{"fullName":{"type":"string","title":"Full name"},"email":{"type":"string","title":"Email"},"phone":{"type":"string","title":"Phone"},"country":{"type":"string","title":"Country","enum":["FR","IT"],"oneOf":[{"const":"FR","title":"France"},{"const":"IT","title":"Italy"}]}}}'
    submitPost:
      path: /intake/api/v1/waiting-list
      responses:
        - when: { status: [202] }
          result: { status: success, title: "You're on the list" }
      otherwise:
        alert: { type: error, title: "We couldn't add you", description: Try again later. }
