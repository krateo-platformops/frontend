# Data list (rows from data via itemTemplate) — antd List API
# Target: arbitrary objects mapped to rows; antd `bordered` + `size` honored.
# Expected behavior: three bordered rows; avatar color from `severity` via the map.
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-list-rows
  namespace: krateo-system
spec:
  widgetData:
    bordered: true
    size: large
    itemTemplate:
      primaryText: "{title}"
      subPrimaryText: "{detail}"
      secondaryText: "{updatedAt}"
      subSecondaryText: "{source}"
      icon: "fa-circle-info"
      color:
        value: "{severity}"
        map: { info: blue, warning: orange, error: red }
        default: gray
      formats:
        secondaryText: datetime
    dataSource:
      - { title: "Composition reconciled", detail: "All resources healthy", severity: info, source: controller, updatedAt: "2026-06-13T09:30:00Z" }
      - { title: "Drift detected", detail: "Spec differs from live state", severity: warning, source: reconciler, updatedAt: "2026-06-13T09:32:00Z" }
      - { title: "Provisioning failed", detail: "Backend returned 500", severity: error, source: provisioner, updatedAt: "2026-06-13T09:35:00Z" }
---
# Grid of child widgets (replaces DataGrid) — antd List `grid` API
# Target: dataSource elements carrying resourceRefId render as child widgets in a grid.
# Expected behavior: responsive grid (1/2/3 columns) of the referenced widgets.
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-list-grid
  namespace: krateo-system
spec:
  widgetData:
    grid: { gutter: 16, xs: 1, sm: 1, md: 2, lg: 3, xl: 3, xxl: 4 }
    dataSource:
      - { resourceRefId: card-1 }
      - { resourceRefId: card-2 }
  resourcesRefs:
    items:
      - id: card-1
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-1
        namespace: krateo-system
        resource: cards
        verb: GET
      - id: card-2
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-2
        namespace: krateo-system
        resource: cards
        verb: GET
---
# Streaming list (Server-Sent Events) — Krateo extension
# Target: items arrive from an SSE topic, capped at 50.
# Expected behavior: loading until the first event, then prepends rows.
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-list-streaming
  namespace: krateo-system
spec:
  widgetData:
    sseEndpoint: "/notifications"
    sseTopic: "krateo"
    maxItems: 50
    itemTemplate:
      primaryText: "{involvedObject.kind}/{involvedObject.name}"
      subPrimaryText: "{message}"
      secondaryText: "{lastTimestamp|firstTimestamp|eventTime}"
      subSecondaryText: "{reason}"
      icon: "fa-bolt"
      color:
        value: "{type}"
        map: { Normal: blue, Warning: orange }
        default: gray
      formats:
        secondaryText: datetime
---
# Stats strip — Krateo `statistic` rowVariant (one dataSource, one tile per item)
# Target: each item is an antd Card + Statistic: title (primaryText), value (secondaryText) and a
# secondary caption (subPrimaryText). `color` resolves only for a bad number, so only those tiles
# are tinted and the rest stay neutral (exception-only colour).
# Expected behavior: four tiles in a row that reflows as it narrows; "Open incidents" in red.
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-list-statistic-strip
  namespace: krateo-system
spec:
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: "{title}"
      secondaryText: "{value}"
      subPrimaryText: "{caption}"
      navigateTo: "{href}"
      color:
        value: "{tone}"
        map: { bad: red, warn: orange }
    dataSource:
      - { title: Open incidents, value: 47, caption: "from 9 alerts", tone: bad, href: "/incidents?status=Open" }
      - { title: Opened in the last 7 days, value: 12, caption: "of 47 open" }
      - { title: Open longer than 7 days, value: 35, caption: "oldest Nov 2", tone: warn }
      - { title: Analyzing, value: 0, caption: "none waiting on the analyzer" }
---
# Active filters — `chip` rowVariant with per-item `removable`
# Target: one chip per applied filter value; `removable: true` on the item adds a trailing remove
# mark and names the chip "Remove filter: <label>"; its navigateTo is the URL without that value
# (computed by the page's RESTAction). A final plain chip clears every filter.
# Expected behavior: "Kind: Alert ✕", "Repo: org/x ✕", "Clear all".
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-list-active-filters
  namespace: krateo-system
spec:
  widgetData:
    hideWhenEmpty: true
    itemTemplate:
      rowVariant: chip
      primaryText: "{label}"
      navigateTo: "{href}"
    dataSource:
      - { label: "Kind: Alert", removable: true, href: "/reviews?repo=org/x" }
      - { label: "Repo: org/x", removable: true, href: "/reviews?kind=Alert" }
      - { label: "Clear all", href: "/reviews" }
