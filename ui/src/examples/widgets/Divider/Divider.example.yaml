# Plain divider
kind: Divider
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-divider-plain
  namespace: krateo-system
spec:
  # The CRD requires widgetData; a plain divider simply sets nothing in it.
  widgetData: {}
---
# Divider with a label
kind: Divider
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: example-divider-label
  namespace: krateo-system
spec:
  widgetData:
    label: "Details"
    titlePlacement: "left"
    plain: true
