# Krateo portal SPA — upstream nginx (official image) server block, deployed to
# /etc/nginx/conf.d/default.conf. Serves the built SPA and reverse-proxies /autopilot/* to the
# kagent A2A endpoint on the SAME origin (no cross-origin request / no CORS preflight; see #50).
# The chart mounts the runtime config.json at /app/config, so the doc root MUST be /app.
#
# The listen port is a placeholder (__NGINX_PORT__) substituted at boot by
# /docker-entrypoint.d/40-krateo-resolver.sh from the FRONTEND_CONTAINER_PORT env (default 8080),
# so the installer's per-component exposePort flows all the way into nginx — the container binds
# whatever the chart's service.port is (containerPort = service.port = targetPort = probe port),
# exactly like the authn/snowplow Go apps already honor their configured port.
server {
  listen       __NGINX_PORT__;
  server_name  _;
  root   /app;
  index  index.html index.htm;

  # Autopilot copilot (optional): same-origin reverse proxy to the kagent A2A endpoint.
  # kagent-ui is resolved at REQUEST time (variable proxy_pass + resolver), NOT at boot — so the
  # portal starts even when kagent/Autopilot is absent or temporarily down; /autopilot/ then returns
  # 502 instead of nginx failing to start and taking down the WHOLE portal UI. (D6, 2026-07-08: the
  # frontend nginx crashlooped with `host not found in upstream "kagent-ui..."` while kagent was down,
  # cascading a full portal-UI outage.) The resolver IP is injected from /etc/resolv.conf by
  # /docker-entrypoint.d/40-krateo-resolver.sh. The `rewrite` reproduces the URI mapping that a
  # literal proxy_pass does implicitly (a variable proxy_pass does not rewrite the location prefix).
  location /autopilot/ {
    resolver __NGINX_RESOLVER__ valid=10s ipv6=off;
    set $autopilot_upstream "kagent-ui.krateo-system.svc.cluster.local";
    rewrite ^/autopilot/(.*)$ /api/a2a/krateo-system/autopilot/$1 break;
    # kagent-ui SERVICE port. kagent >= 0.1.7 (the krateo-agentiko wrapper) exposes the UI Service
    # on 8080 (not 80 as older kagent did) — dialing the wrong one blackholes the SYN and 504s on
    # every rail request, so this must track the kagent chart's ui.service port.
    proxy_pass http://$autopilot_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;        # SSE: stream frames as they arrive, do not buffer
    proxy_connect_timeout 10s;  # fail fast (502) if kagent-ui is unreachable — never hang ~60s on a bad connect
    proxy_send_timeout 1h;      # match the read timeout for long-lived request/stream symmetry
    proxy_read_timeout 1h;      # long-lived agent stream
  }

  # Evidence panel: a delegated turn's specialist activity is stored in its own kagent session,
  # read as a sibling of the A2A path above (longest-prefix match wins).
  location /autopilot/sessions/ {
    # In this mode nothing else gates the method: the gateway (and its GET-only clause) is out of
    # the path, and kagent-ui serves DELETE on the same prefix.
    limit_except GET {
      deny all;
    }
    resolver __NGINX_RESOLVER__ valid=10s ipv6=off;
    set $sessions_upstream "kagent-ui.krateo-system.svc.cluster.local";
    rewrite ^/autopilot/sessions/(.*)$ /api/sessions/$1 break;
    proxy_pass http://$sessions_upstream:8080;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
