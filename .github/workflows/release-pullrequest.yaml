name: release-pullrequest

on:
  pull_request:
    branches:
      - main

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main
  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"frontend","context":"ui"}]'
      push: false
      # NOT github.ref_name: on a pull_request that is "<number>/merge" (the merge ref), and the
      # Dockerfile runs `npm version $VERSION`, which rejects it — "Invalid version: 101/merge" — so
      # every PR build failed. It works on a tag because there ref_name IS the semver.
      #
      # Plain X.Y.Z, matching the shape release-tag.yaml feeds in: the patch component is the PR
      # number, so each PR build is still unique, and every build in this repo carries the same
      # version shape. 0.0.x sorts below any real release. The image is never pushed here
      # (push: false), so this only has to be a valid npm version.
      build_args: |
        VERSION=0.0.${{ github.event.pull_request.number }}
        APP_BUILD=${{ github.sha }}
  crds:
    name: Generate crds
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install krateoctl v0.8.9
        # The version MUST be passed to the piped shell as `bash -s 0.8.9`, NOT as
        # `install.sh 0.8.9 | bash`: in the latter the `0.8.9` is a positional arg to
        # `curl` (silently ignored), so install.sh runs with no args and falls through to
        # its "latest release" path — which today resolves to v1.3.0-rc1 (a non-prerelease
        # tag). That krateoctl regresses on Theme.schema.json: `gen-widget` spins ~3min in
        # controller-gen then exits 1 (empty output), red-lighting this whole job while the
        # step still claims "v0.8.9". v0.8.9 generates every widget CRD (Theme included) fine.
        run: curl -sL https://raw.githubusercontent.com/krateoplatformops/krateoctl/main/install.sh | bash -s 0.8.9

      - name: Checkout repository
        uses: actions/checkout@v4

      # Every step below runs in ui/: that is where package.json lives (there is no root one, so
      # `npm run generate-crds` failed with 'Missing script'), and where scripts/gen-crds.ts and its
      # krateoctl-output live. The job still assumed the pre-`ui/` layout the image build already moved
      # past — its context is `ui`.
      - name: Install tsx, chalk
        working-directory: ui
        run: |
          npm install tsx chalk

      - name: Generate crds
        working-directory: ui
        run: |
          npm run generate-crds

      - name: List files in scripts/krateoctl-output
        working-directory: ui
        run: |
          ls -la ./scripts/krateoctl-output

      # working-directory does not apply to `uses:` steps, so this path is spelled out.
      - name: Upload .yaml files from scripts/krateoctl-output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-crds-yaml-files
          path: ${{ github.workspace }}/ui/scripts/krateoctl-output/*.yaml
