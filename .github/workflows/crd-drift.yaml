# Makes the CRD GENERATOR the source of truth for helm/frontend-crds/templates/.
#
# Widget CRDs are derived from each widget's *.schema.json by `npm run generate-crds`. The chart
# copy was only ever refreshed at RELEASE time (the `crds` job in release-tag.yaml opens a sync PR
# on a tag), so between releases `main` could carry a chart CRD that no longer matched its schema —
# and nothing said so.
#
# It happened: Paragraph.crd.yaml sat at `format: int32` for `level` while the generator had moved
# to `enum: [1,2,3,4,5]`. The LIVE CRD was looser than the schema, so a `level: 9` Paragraph would
# have been accepted by the apiserver and rejected by nothing until it rendered.
#
# This job regenerates on every PR and fails if the committed chart differs. Schema change and CRD
# change now land together or not at all.
#
# THE KNOWN GAP THIS BLOCK USED TO DESCRIBE IS CLOSED, and the stale version of it is worth
# recording rather than simply deleting, because it was false in every clause for weeks.
#
# It said: "the generator is pinned to krateoctl v0.8.9, and that version DROPS an `enum` on an
# integer property … the real fix is a krateoctl bump, and that is blocked on the Theme.schema.json
# regression". None of that is true any more. krateoctl is retired (#604): the generator is this
# repo's own `crdgen/`, there is nothing to pin, and the enum survives.
#
# Verified rather than assumed, on the published artifact and not just the working tree:
#
#   Paragraph.schema.json          level: {type: integer, enum: [1,2,3,4,5]}
#   generated CRD today            level: {type: integer, enum: [1,2,3,4,5]}
#   PUBLISHED frontend-crds 1.8.21 level: {type: integer, enum: [1,2,3,4,5]}
#
# So `level: 9` is now refused by the apiserver, where the pinned krateoctl emitted `format: int32`
# and admitted it. `level` was the only integer enum across all 44 widget schemas, so this was the
# whole of the gap.
#
# NOTE FOR WHOEVER READS #604's DIFF: that PR removed `format: int32` in 280 places and I described
# it as a validation LOOSENING. It was — int32 became effectively int64 — but on `level`,
# the one property anybody had written a gap note about, it simultaneously RESTORED the enum, which
# is a tightening that more than covers it. Judging a regeneration by one of its two effects is how
# that went unnoticed in review.
name: crd-drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go for the CRD generator
        uses: actions/setup-go@v5
        with:
          # From crdgen/go.mod, not a literal. The krateoctl install this replaced carried a
          # version pinned by hand in THREE workflows with a comment in each saying "if one moves,
          # move both" — which is a drift surface maintained by hope. The generator's own go.mod is
          # the single place its toolchain floor is declared.
          go-version-file: crdgen/go.mod
          cache-dependency-path: crdgen/go.sum
      - uses: actions/setup-node@v4
        with:
          # Matches ui/Dockerfile's build stage (node:24.2.0-alpine3.22). CI validating on an
          # older Node than the one that produces the artifact is backwards, and it was also what
          # held @types/node at 22 while the build had already moved on.
          node-version: '24'
      - name: Install ui deps
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Regenerate widget CRDs
        working-directory: ui
        run: npm run generate-crds
      # BEFORE the drift comparison, because drift and validity are different questions and this
      # one is the question the 1.8.20 outage turned on. crd-drift asserted the chart MATCHED the
      # generator and passed, because both carried the same defect: `resourcesRefsTemplate.items`
      # required `id` while defining only `iterator` and `template`, so every widget CR with a
      # resourcesRefsTemplate was unappliable on all 44 kinds. A gate that compares two artifacts
      # cannot judge either of them, and plumbing/crdgen's own apiserver validation accepts a
      # required-but-undefined property — it is legal OpenAPI, merely unsatisfiable.
      - name: Assert every CRD can be satisfied
        working-directory: crdgen
        run: go test ./... -count=1

      # A DIFFERENT QUESTION from both gates above, and the one 1.8.20 turned on. Satisfiability
      # asks whether an object can exist; drift asks whether two artifacts agree NOW. Neither asks
      # whether the new schema still admits what the PINNED one accepted — and a tightening is
      # silent at the roll, because stored objects are not revalidated when a CRD changes. The
      # failure lands on the next WRITE to an existing object, attributed to whoever made it.
      #
      # Measured rather than argued: against the real predecessor (1.8.16 — 1.8.17 through 1.8.19
      # shipped image-only, so the chart never moved), this reports 46 tightenings across 44 CRD
      # versions in 1.8.20, the first being
      # `resourcesRefsTemplate[] now requires [id]`. It would have failed that PR.
      #
      # Behind a build tag because it needs the network and a helm binary: left in the default
      # `go test ./...` it would red every offline run, and the usual repair for that is a skip —
      # at which point it skips in CI too and the gate is decoration. The comparison it calls is
      # exercised offline by TestTightenings in the step above, so no clause depends on this step
      # running.
      - name: Install Helm for the baseline pull
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Assert no widget CRD became stricter than the PINNED one
        working-directory: crdgen
        # No -run filter. It used to select only the gate, so every other test behind this tag — the
        # classifier and the probe-failure arm — compiled in nobody's CI and protected nothing.
        run: go test -tags baseline ./... -count=1 -v

      - name: Assert the chart matches the generator
        run: |
          # The generator writes to ui/scripts/generated-crds/ rather than into the chart, so the
          # comparison is explicit. Both directions matter: a chart CRD the generator no longer
          # produces is as wrong as one it produces differently.
          fail=0
          for f in ui/scripts/generated-crds/*.crd.yaml; do
            b=$(basename "$f")
            if [ ! -f "helm/frontend-crds/templates/$b" ]; then
              echo "::error file=helm/frontend-crds/templates/$b::generated but missing from the chart"
              fail=1
            elif ! diff -u "helm/frontend-crds/templates/$b" "$f"; then
              echo "::error file=helm/frontend-crds/templates/$b::drifted from the generator output"
              fail=1
            fi
          done
          for f in helm/frontend-crds/templates/*.crd.yaml; do
            b=$(basename "$f")
            [ -f "ui/scripts/generated-crds/$b" ] || {
              echo "::error file=$f::in the chart but no longer produced by the generator"; fail=1; }
          done
          if [ "$fail" = "1" ]; then
            echo "::error::widget CRDs drifted — run 'cd ui && npm run generate-crds', copy ui/scripts/generated-crds/*.crd.yaml over helm/frontend-crds/templates/, and commit"
            exit 1
          fi
          echo "all widget CRDs match the generator"
      - name: Assert no widget CRD became permissive
        # snowplow uses these CRD schemas as its RUNTIME validation oracle: it compiles each
        # widget CRD's structural schema and validates the object's widgetData against it
        # (snowplow internal/resolvers/crds/schema/schema.go). So a node that gains
        # x-kubernetes-preserve-unknown-fields does not merely relax `kubectl apply` — it makes
        # snowplow's validation of that whole subtree VACUOUS, accepting anything and reporting
        # nothing. The inverse costs more: a node wrongly NARROWED makes snowplow reject valid
        # widget content at request time. Both are silent at generation.
        #
        # 153 of these nodes are deliberate (open `status`, arbitrary `payload` on resourcesRefs
        # and action ops, Form's user-authored `schema`, each chart's `data.items`), so the check
        # is an allowlist rather than a ban: it fails on a node that became permissive without
        # anyone deciding it should. That is the failure mode a generator change introduces —
        # crdgen's transpileAllOf marks EVERY merged node preserve-unknown, even one merging two
        # clean object members, and so do patternProperties, divergent unions and unresolved $refs.
        working-directory: ui
        run: npm run check-crd-strictness

      - name: Assert the generator left no tracked file dirty
        run: |
          # The generator writes <Widget>.schema.crd.yaml next to each schema and gen-crds.ts moves it
          # into the output dir. Those intermediates must not be committed — two were, and every
          # generator run then showed them as deletions.
          git diff --exit-code \
            || { echo "::error::running the generator modified tracked files — a build intermediate is committed that should be gitignored"; exit 1; }
