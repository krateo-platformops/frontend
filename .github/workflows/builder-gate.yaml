# The builder gate (builder-gate/, helm/builder-gate): every step it promises is RUN here, not
# assumed. No path filter, so it can be a required check.
#
#   gate        unit suite: one mutation per rule, the dry-run guard (every mutating request carries
#               dryRun=All and fieldValidation=Strict), the MCP surface end to end, the pins;
#               then the example page draft through the gate OFFLINE — the only place the live
#               steps are turned off, by the CLI's --offline flag — asserting every offline step
#               ran and passed and every live step said DISABLED; then snowplow's jq modules
#               diffed against the tag SNOWPLOW_REF names, at every depth; then the stage reason
#               codes the gate knows (STAGE_REASONS) compared with snowplow's at the snowplow
#               installer main pins, and SNOWPLOW_REF itself compared with the RELEASED installer's.
#   kind        the gate's identity against a real API server, as the chart's own ServiceAccount:
#               it reads its own Builder and no other; it may not create, get or list widgets,
#               RESTActions or Secrets; with no caller token it judges nothing live, and that is
#               red; nothing is stored.
#   (gate)      also replays the secrets-rule corpus through the portal's OWN lint-ra-secrets.py.
#
# The image itself (multi-arch) is built by release-pullrequest.yaml / release-tag.yaml.
name: builder-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder-gate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder-gate/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: builder-gate/jqcheck/go.mod
          cache-dependency-path: builder-gate/jqcheck/go.sum
      - name: Build jqcheck (snowplow's gojq fork and modules)
        working-directory: builder-gate/jqcheck
        run: go build -o ../bin/jqcheck . && echo "JQCHECK_BIN=$GITHUB_WORKSPACE/builder-gate/bin/jqcheck" >> "$GITHUB_ENV"
      - name: jqcheck's module loader resolves names as snowplow's does
        # main_test.go: every vendored module is embedded (a nested directory needs its own
        # //go:embed pattern), and a name outside the vendored set is "not found".
        working-directory: builder-gate/jqcheck
        run: go test ./... -count=1
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install ui's deps, which the shared eslint config resolves from
        # builder-gate/eslint.config.js imports ../ui/eslint/base.js to share the portal's rules.
        # Node resolves a bare import from the IMPORTING file's directory, so those plugins are
        # looked up in ui/node_modules — declaring them in builder-gate cannot satisfy them, which
        # is what I tried first. The package that owns the config owns its plugins.
        working-directory: ui
        run: npm ci --no-audit --no-fund
      # The build also writes generated/widget-schemas.json, which the typecheck reads.
      - name: Build
        run: node build.mjs
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        # The config shares ui's rules (../ui/eslint/), so builder-gate and the portal hold the
        # same standard rather than drifting. It was committed earlier but could not run: no eslint
        # dependency was declared, there was no script, and the config threw on load. Now that it
        # is clean this gate keeps it clean — 312 errors and 152 warnings is what accumulated while
        # nothing checked.
        run: npm run lint
      # `run`, never bare `vitest` (a watch). The global setup builds dist/ first.
      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: The example page draft through the gate, offline
        run: |
          set -euo pipefail
          node dist/cli.cjs --offline --builder portal-builder \
            --builders-dir ../ui/src/builders/fixtures --draft examples/pod-sizing-page.json > envelope.json \
            || { cat envelope.json; exit 1; }
          cat envelope.json
          # Green, and green because every offline step RAN and passed — not because one was skipped.
          jq -e '.ok == true and .failedStep == null' envelope.json
          for s in builder builder-lint references jq-compile; do
            jq -e --arg s "$s" '[.steps[] | select(.name == $s and .ok == true and (.problems | length) == 0)] | length == 1' envelope.json \
              || { echo "::error::step $s did not run and pass"; exit 1; }
          done
          jq -e '.steps[] | select(.name == "builder-lint") | .notes[0] == "4 object(s) linted by the portal'"'"'s own page lint (pageLint.ts) over this release'"'"'s widget schemas"' envelope.json
          jq -e '.steps[] | select(.name == "jq-compile") | .notes[0] | startswith("3 expression(s) compiled")' envelope.json
          # The live steps reported themselves disabled (by the flag, in this job only).
          for s in live-dry-run data coverage; do
            jq -e --arg s "$s" '.steps[] | select(.name == $s) | .notes[0] | startswith("DISABLED: offline run")' envelope.json \
              || { echo "::error::step $s did not report itself disabled"; exit 1; }
          done

      - name: The secrets rule against the portal's own lint-ra-secrets.py and fetchableDefs
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          ref="$(tr -d '[:space:]' < test/secrets/PORTAL_REF)"
          portal="$RUNNER_TEMP/portal"
          mkdir -p "$portal/scripts" "$portal/helm/portal/templates"
          gh api "repos/krateo-platformops/portal/contents/scripts/lint-ra-secrets.py?ref=${ref}" --jq .content | base64 -d > "$portal/scripts/lint-ra-secrets.py"
          gh api "repos/krateo-platformops/portal/contents/helm/portal/templates/_fetchable.tpl?ref=${ref}" --jq .content | base64 -d > "$portal/helm/portal/templates/_fetchable.tpl"
          python3 test/secrets/conformance.py "$portal"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: snowplow's jq modules match the tag in SNOWPLOW_REF, at every depth
        # The listing is the git tree of snowplow's modules/ directory, recursive, so a nested
        # module (modules/krateo/architecture/v1.jq, snowplow 1.12.50+) is listed like a top-level
        # one: the old `contents` listing named only the `krateo` directory, and the old diff loop
        # read only jqcheck/modules/*.jq. Every file, not only *.jq, so nothing can sit in either
        # tree unseen.
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < SNOWPLOW_REF)"
          base=go/snowplow/internal/support/jq
          sha="$(gh api "repos/krateo-platformops/snowplow/contents/${base}?ref=${ref}" --jq '.[] | select(.name == "modules" and .type == "dir") | .sha')"
          test -n "$sha" || { echo "::error::snowplow ${ref} has no ${base}/modules directory"; exit 1; }
          gh api "repos/krateo-platformops/snowplow/git/trees/${sha}?recursive=1" > tree.json
          jq -e '.truncated == false' tree.json > /dev/null || { echo "::error::the modules tree listing was truncated"; exit 1; }
          jq -r '.tree[] | select(.type == "blob") | .path' tree.json | sort > upstream.txt
          (cd jqcheck/modules && find . -type f | sed 's|^\./||') | sort > local.txt
          test -s upstream.txt || { echo "::error::snowplow ${ref} lists no module file"; exit 1; }
          diff -u upstream.txt local.txt
          while read -r m; do
            curl -fsSL "https://raw.githubusercontent.com/krateo-platformops/snowplow/${ref}/${base}/modules/${m}" | diff -u - "jqcheck/modules/${m}"
          done < upstream.txt
          echo "$(wc -l < upstream.txt) module file(s) at snowplow ${ref}, identical: $(tr '\n' ' ' < upstream.txt)"
        env:
          GH_TOKEN: ${{ github.token }}

      # snowplowRef.test.ts pulls the released installer chart, as crdgen's baseline does.
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0
      - name: snowplow's stage reason codes and SNOWPLOW_REF match the snowplow the installer pins
        # test/drift/, out of the unit run above because it needs the network; a read that fails
        # is a red here, never a pass.
        #   stageReasons.test.ts  installer MAIN's snowplow pin, then that tag's stage_outcomes.go
        #                         (resolving a constant assigned from another snowplow package);
        #                         fails naming every code missing on either side.
        #   snowplowRef.test.ts   SNOWPLOW_REF equals the RELEASED installer chart's snowplow pin;
        #                         fails naming both. Released, not main: a module vendored ahead of
        #                         the cluster would let the gate accept an include snowplow cannot.
        run: npx vitest run --config vitest.drift.config.ts --reporter=verbose
        env:
          GH_TOKEN: ${{ github.token }}

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder-gate/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: builder-gate/jqcheck/go.mod
          cache-dependency-path: builder-gate/jqcheck/go.sum
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0
      - name: Build the gate
        working-directory: builder-gate
        run: |
          (cd jqcheck && go build -o ../bin/jqcheck .)
          echo "JQCHECK_BIN=$GITHUB_WORKSPACE/builder-gate/bin/jqcheck" >> "$GITHUB_ENV"
          npm ci --no-audit --no-fund
          node build.mjs
      - uses: helm/kind-action@v1
        with:
          cluster_name: builder-gate
      - name: The gate's identity against a real API server
        env:
          KUBECONFIG_FILE: /home/runner/.kube/config
          KUBE_CONTEXT: kind-builder-gate
        run: builder-gate/test/kind/run.sh
