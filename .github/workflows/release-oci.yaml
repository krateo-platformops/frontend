# Publishes this repo's Helm charts on a release tag. The workflow itself is the org-wide reusable —
# this file supplies only the triggers, so "identical across every chart repo" becomes structural
# instead of a 137-line copy each repo has to keep in step by hand.
#
# The shared workflow also gates the publish on every chart-referenced image existing: a chart that
# names an image which was never published used to publish cleanly and then ImagePullBackOff on every
# install, with the symptom surfacing several layers from the cause
# (krateo-platformops/oasgen-provider#62).
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false
      dry_run:
        description: "Rehearse: build, stamp and check everything, push nothing. Default true for a manual run."
        type: boolean
        default: true

jobs:
  # The charts are what the installer PINS, so this gate matters more here than anywhere: 1.8.12's
  # charts published cleanly from a red main and were pinned and rolled. See tested.yaml.
  tested:
    uses: ./.github/workflows/tested.yaml
  release-oci:
    needs:
      - tested
    # The fixed 2.0.0 (acmp, owner of krateo-platformops/.github): 7da11cb pins krateo-blueprints/charts
    # 1.9.3, with no dangling symlink, so package-and-push gets past "Prepare all required actions"
    # (proven by a caller dry run, alert-provider run 45083740900). NOT b030d3f, which cannot package.
    # 1.8.70 was republished on 1.1.0 (f6185ef) while this was broken.
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@7da11cb60cee5cbfc7d9e8c9328692807b43cefd # main 2026-11-22
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ github.event.inputs.chart_version || '' }}
      app_version: ${{ github.event.inputs.app_version || '' }}
      # 2.0.0's required input: which krateo-blueprints index channel these charts go to. `none`:
      # frontend, frontend-crds and builder-gate are platform components the installer pins from
      # ghcr.io/krateo-platformops/charts, never blueprints, pages or operators in that index.
      index_channel: none
      # A manual run is a rehearsal unless asked otherwise: it builds, stamps and checks everything and
      # pushes nothing. A tag push is never a dry run.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
