# Krateo COMPONENT release workflow — frontend variant. The `build` job now calls the SHARED
# reusable multi-platform image build (krateo-platformops/.github) — one source of truth, no
# per-repo drift (this is what fixes the prior amd64-only frontend image that could not run on
# arm64 nodes). The `crds` job stays frontend-specific: widget CRDs are generated from the
# TypeScript widget definitions by this repo's own `crdgen/` Go module (driven from npm via
# ui/scripts/gen-crds.ts), not by the shared Go controller-gen path, so it cannot use the shared
# `make generate` entry point. It used to be krateoctl, installed by piping a release script to
# bash and pinned by hand in three workflows; #604 retired that.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  # No tag publishes an artifact that has not passed the suite — see tested.yaml for the two
  # releases that taught us this and why it runs the suite rather than reading check-runs.
  tested:
    uses: ./.github/workflows/tested.yaml
  build:
    needs:
      - tested
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@7da11cb60cee5cbfc7d9e8c9328692807b43cefd # 2.0.0
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"frontend","context":"ui"},{"mod":"builder-gate","context":".","dockerfile":"builder-gate/Dockerfile"}]'
      build_args: |
        VERSION=${{ github.ref_name }}
        APP_BUILD=${{ github.sha }}
  crds:
    name: Generate crds
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 @ 2026-11-23
      - name: Set up Go for the CRD generator
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 @ 2026-11-23
        with:
          # From crdgen/go.mod, not a literal. The krateoctl install this replaced carried a
          # version pinned by hand in THREE workflows with a comment in each saying "if one moves,
          # move both" — which is a drift surface maintained by hope. The generator's own go.mod is
          # the single place its toolchain floor is declared.
          go-version-file: crdgen/go.mod
          cache-dependency-path: crdgen/go.sum

      # generate-crds lives in ui/package.json and gen-crds.ts writes to
      # process.cwd()/scripts/generated-crds — so every npm step MUST run from ui/.
      # Use the lockfile (npm ci): the old `npm install tsx chalk` both ran at the repo
      # root (no package.json → hard fail) AND omitted glob + js-yaml, which gen-crds.ts
      # also imports. npm ci installs the exact declared devDep set (tsx, chalk, glob, js-yaml, …).
      - name: Install ui deps (npm ci)
        working-directory: ui
        run: |
          npm ci

      - name: Generate crds
        working-directory: ui
        run: |
          npm run generate-crds

      # Gate the generated CRDs before they are proposed, not after. This is the workflow that
      # produces what ships, and 1.8.20 shipped 44 unsatisfiable widget CRDs through it: every
      # `resourcesRefsTemplate.items` required `id` while defining only `iterator` and `template`,
      # which structural-schema pruning makes impossible to satisfy. crd-drift could not catch it
      # (it compares the chart to the generator, and both agreed) and plumbing/crdgen's apiserver
      # validation accepts it (legal OpenAPI, merely unsatisfiable). The test asserts the one thing
      # neither of those asks: that an object with that field can exist.
      - name: Assert every CRD can be satisfied
        working-directory: crdgen
        run: go test ./... -count=1

      - name: List files in /scripts/generated-crds
        working-directory: ui
        run: |
          ls -la ./scripts/generated-crds

      - name: Upload .yaml files from /scripts/generated-crds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 @ 2026-11-23
        with:
          name: frontend-crds-yaml-files
          path: ${{ github.workspace }}/ui/scripts/generated-crds/*.yaml

      # The chart this tag ships is the tag's own helm/frontend-crds (release-oci packages it from
      # this commit), and the drift gate keeps it equal to the generator on every PR. So the
      # release checks that equality AT THE TAG instead of pushing a sync PR to main: comparing the
      # tag's generator output with main's chart was a race (a widget merged on main while a tag
      # was releasing made a diff that the tag never had, as at 1.8.99), and the push needed a
      # cross-repo token for what is now the same repo.
      - name: The tag's chart carries the CRDs its widgets generate
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          shopt -s nullglob
          gen=(ui/scripts/generated-crds/*.crd.yaml)
          [ "${#gen[@]}" -gt 0 ] || { echo "::error::no generated CRDs in ui/scripts/generated-crds"; exit 1; }
          mkdir -p /tmp/gen /tmp/chart
          cp ui/scripts/generated-crds/*.crd.yaml /tmp/gen/
          cp helm/frontend-crds/templates/*.crd.yaml /tmp/chart/
          if ! diff -r /tmp/gen /tmp/chart > /tmp/crd.diff; then
            echo "::error title=Widget CRDs drifted at this tag::helm/frontend-crds/templates does not match what this tag's widgets generate; the published frontend-crds chart would be wrong. Run generate-crds on main, copy into helm/frontend-crds/templates, release again."
            cat /tmp/crd.diff
            exit 1
          fi
          echo "helm/frontend-crds at ${GITHUB_REF_NAME} matches the ${#gen[@]} generated CRDs."
