# The unit suite, in CI. It was never run here: typecheck.yaml says in its own header that it runs
# `npm run typecheck` and NOT `npm test`, because ui/package.json defines `"test": "vitest"` with no
# subcommand — so `npm test` starts a WATCH and a CI job invoking it hangs until the timeout instead
# of failing. That reasoning is correct and the conclusion drawn from it was to run nothing.
#
# So this calls `vitest run` explicitly, which is what that header asks any future test job to do.
# 1891 tests existed with no gate: a pull request that broke every one of them showed all-green.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Matches ui/Dockerfile's build stage (node:24.2.0-alpine3.22). CI validating on an
          # older Node than the one that produces the artifact is backwards, and it was also what
          # held @types/node at 22 while the build had already moved on.
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install ui deps
        run: npm ci --no-audit --no-fund
      # `run`, never bare `vitest` — see the header.
      - name: Unit tests
        run: npx vitest run --reporter=dot

      # The composer derives what it knows about widget kinds — which hold children, what each
      # REQUIRES, the skeleton to create one — from helm/frontend-crds at build time, and commits
      # the result. This re-derives and diffs, so a CRD gaining a required field fails a pull
      # request instead of an apiserver rejection at publish, which is where it used to surface.
      - name: Widget kinds in step with the CRDs
        run: npx tsx scripts/gen-widget-kinds.ts --check

      # Each widget's <Widget>.type.d.ts is generated from its <Widget>.schema.json and committed.
      # Nothing checked that, and seven drifted: hand-edited, or left behind when a schema gained a
      # field. This regenerates in memory and fails, naming the file, when a committed type file
      # differs from its schema's output.
      - name: Widget types in step with the schemas
        run: npx tsx scripts/generate-types.ts --check

  # Browser checks against the BUILT app (ui/e2e): what only a real hard load can show — the router
  # on a cold start, real storage, the headers that actually leave. The first is the public route:
  # /public/<slug> with a stored session renders outside the signed-in shell and sends no token.
  # Same Playwright image as the visual job (design-system.yaml), so the browsers are already there.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - name: Install ui deps
        run: npm ci --no-audit --no-fund
      - name: Build the app and run the browser checks
        run: npm run e2e
      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ui/test-results/e2e
            ui/playwright-report
