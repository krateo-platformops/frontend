apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forms.widgets.templates.krateo.io
spec:
  group: widgets.templates.krateo.io
  names:
    categories:
      - widgets
      - krateo
    kind: Form
    listKind: FormList
    plural: forms
    singular: form
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: 'The widget''s contract: its own data, an optional binding to a RESTAction, the resources it references, and any templated overrides.'
              properties:
                apiRef:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                    - namespace
                  type: object
                resourcesRefs:
                  properties:
                    items:
                      items:
                        properties:
                          apiVersion:
                            type: string
                          id:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                          payload:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          resource:
                            type: string
                          slice:
                            properties:
                              continue:
                                type: boolean
                              offset:
                                type: integer
                              page:
                                type: integer
                              perPage:
                                type: integer
                            required:
                              - perPage
                            type: object
                          verb:
                            enum:
                              - POST
                              - PUT
                              - PATCH
                              - DELETE
                              - GET
                            type: string
                        required:
                          - id
                        type: object
                      type: array
                    slice:
                      properties:
                        continue:
                          type: boolean
                        offset:
                          type: integer
                        page:
                          type: integer
                        perPage:
                          type: integer
                      required:
                        - perPage
                      type: object
                  required:
                    - items
                  type: object
                resourcesRefsTemplate:
                  items:
                    properties:
                      iterator:
                        type: string
                      template:
                        properties:
                          apiVersion:
                            type: string
                          id:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                          payload:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          resource:
                            type: string
                          verb:
                            enum:
                              - POST
                              - PUT
                              - PATCH
                              - DELETE
                              - GET
                            type: string
                        required:
                          - id
                        type: object
                    type: object
                  type: array
                widgetData:
                  description: the data that will be passed to the widget on the frontend
                  properties:
                    actions:
                      description: the actions of the widget
                      properties:
                        navigate:
                          description: client-side navigation actions
                          items:
                            properties:
                              id:
                                description: unique identifier for the action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              path:
                                description: the identifier of the route to navigate to
                                type: string
                              requireConfirmation:
                                description: whether user confirmation is required before navigating
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              type:
                                description: type of navigation action
                                enum:
                                  - navigate
                                type: string
                            required:
                              - id
                              - type
                            type: object
                          type: array
                        openDrawer:
                          description: actions to open side drawer components
                          items:
                            properties:
                              id:
                                description: unique identifier for the drawer action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              requireConfirmation:
                                description: whether user confirmation is required before opening
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              size:
                                description: drawer size to be displayed
                                enum:
                                  - default
                                  - large
                                type: string
                              title:
                                description: title shown in the drawer header
                                type: string
                              type:
                                description: type of drawer action
                                enum:
                                  - openDrawer
                                type: string
                            required:
                              - id
                              - resourceRefId
                              - type
                            type: object
                          type: array
                        openModal:
                          description: actions to open modal dialog components
                          items:
                            properties:
                              customWidth:
                                description: the custom width of the value, which should be used by setting the 'custom' value inside the 'size' property
                                type: string
                              id:
                                description: unique identifier for the modal action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              requireConfirmation:
                                description: whether user confirmation is required before opening
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              size:
                                description: sets the Modal size, 'default' is 520px, 'large' is 80% of the screen width, 'fullscreen' is 100% of the screen width, 'custom' should be used with the 'customWidth' property
                                enum:
                                  - default
                                  - large
                                  - fullscreen
                                  - custom
                                type: string
                              title:
                                description: title shown in the modal header
                                type: string
                              type:
                                description: type of modal action
                                enum:
                                  - openModal
                                type: string
                            required:
                              - id
                              - resourceRefId
                              - type
                            type: object
                          type: array
                        rest:
                          description: rest api call actions triggered by the widget
                          items:
                            properties:
                              errorMessage:
                                description: a message that will be displayed inside a toast in case of error
                                type: string
                              fanOutPath:
                                description: 'name of an ARRAY field in the submitted values: the action fans out into ONE ordered write per element (for each write, that field is replaced by the single element before payload/payloadToOverride interpolation). The whole set is gated behind ONE aggregated blast-radius confirm and dispatched sequentially with stop-on-first-error and per-item results (W0-4 applySet semantics); onEventNavigateTo is not supported on a fan-out action'
                                type: string
                              headers:
                                description: 'array of headers as strings, format ''key: value'''
                                items:
                                  description: 'key and value as a single, example: ''x-custom-header: value'''
                                  type: string
                                type: array
                              id:
                                description: unique identifier for the action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              onEventNavigateTo:
                                description: conditional navigation triggered by a specific event
                                properties:
                                  eventReason:
                                    description: identifier of the awaited event reason
                                    type: string
                                  loadingMessage:
                                    description: message to display while waiting for the event
                                    type: string
                                  reloadRoutes:
                                    description: Re-fetch the route table before navigating. Set it when the action creates its own destination — publishing a new page, for example — so the route exists by the time the navigation happens.
                                    type: boolean
                                  timeout:
                                    default: 50
                                    description: the timeout in seconds to wait for the event
                                    type: integer
                                  url:
                                    description: url to navigate to when the event is received
                                    type: string
                                required:
                                  - eventReason
                                  - url
                                type: object
                              onSuccessNavigateTo:
                                description: url to navigate to after successful execution
                                type: string
                              ops:
                                description: 'ordered list of DISTINCT writes applied as ONE gated set (e.g. one Form submit creating a Role AND its RoleBinding): each op resolves its OWN resourceRefId (verb + path + payload base) and builds its OWN payload/payloadToOverride against the SAME submitted values. The whole set is gated behind ONE aggregated blast-radius confirm and dispatched sequentially with stop-on-first-error and per-item results (W0-4 applySet semantics). Mutually exclusive with fanOutPath; onEventNavigateTo is not supported on a multi-op action. The action''s own top-level payload/payloadToOverride are IGNORED when ops is present and its top-level resourceRefId is ignored for dispatch (it must still name a valid resource ref — point it at the first op''s)'
                                items:
                                  properties:
                                    payload:
                                      description: static payload sent with this op's request
                                      type: object
                                      x-kubernetes-preserve-unknown-fields: true
                                    payloadToOverride:
                                      description: list of this op's payload fields to override dynamically (values interpolate against the same submitted values as every other op)
                                      items:
                                        properties:
                                          name:
                                            description: name of the field to override
                                            type: string
                                          value:
                                            description: value to use for overriding the field
                                            type: string
                                        required:
                                          - name
                                          - value
                                        type: object
                                      type: array
                                    resourceRefId:
                                      description: 'the identifier of the resource ref this op targets: its verb (must be mutating), path and payload base'
                                      type: string
                                  required:
                                    - resourceRefId
                                  type: object
                                type: array
                              payload:
                                description: static payload sent with the request
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              payloadToOverride:
                                description: list of payload fields to override dynamically
                                items:
                                  properties:
                                    name:
                                      description: name of the field to override
                                      type: string
                                    value:
                                      description: value to use for overriding the field
                                      type: string
                                  required:
                                    - name
                                    - value
                                  type: object
                                type: array
                              requireConfirmation:
                                description: whether user confirmation is required before triggering the action
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              successMessage:
                                description: a message that will be displayed inside a toast in case of success
                                type: string
                              type:
                                description: type of action to execute
                                enum:
                                  - rest
                                type: string
                            required:
                              - headers
                              - id
                              - resourceRefId
                              - type
                            type: object
                          type: array
                      type: object
                    allowedResources:
                      description: the resource plurals this container may hold as children. The enum is what this KIND can ever hold, by role. WHICH of them this instance accepts is its own declaration, checked against its real children by the X5 lint. Empty means unconstrained.
                      items:
                        type: string
                        enum:
                          - checkboxes
                          - datepickers
                          - inputnumbers
                          - inputs
                          - radios
                          - rangepickers
                          - selects
                          - sliders
                          - switches
                          - uploads
                      type: array
                    autocomplete:
                      description: 'Configuration for the Autocomplete form fields. The field options could be configured using enum values coming from the schema or via an API call made using a RESTAction which sould be defined below. The RESTActions shuold contain a `status` field, which is an array of object with the `{ label, value }` format. '
                      items:
                        properties:
                          closed:
                            description: 'true: only a listed value is accepted (a select); false: the list suggests and typed text is kept. Default false (the previous frontend rendered autocomplete fields as an autocomplete)'
                            type: boolean
                          extra:
                            description: parameter to be added to the RESTAction call
                            properties:
                              key:
                                description: the key of the additional parameter
                                type: string
                            required:
                              - key
                            type: object
                          fallback:
                            description: '`manual`: a closed field whose options cannot be loaded (the RESTAction fails, or answers an empty list) takes a typed value instead of blocking the form'
                            enum:
                              - manual
                            type: string
                          minChars:
                            description: 'with `extra`: the typed text is sent once it has this many characters. Default 2'
                            minimum: 1
                            type: integer
                          name:
                            description: the name of the autocomplete field
                            type: string
                          resourceRefId:
                            description: the identifier of the RESTAction that should be called to retrieve autocomplete data
                            type: string
                        required:
                          - name
                        type: object
                      type: array
                    buttonConfig:
                      description: custom labels and icons for form buttons
                      properties:
                        draft:
                          description: draft button configuration — only rendered when widgetData.draftActionId is also set; clicking it persists the current (un-validated) field values via that action
                          properties:
                            icon:
                              description: icon name for draft button
                              type: string
                            label:
                              description: text label for draft button
                              type: string
                          type: object
                        primary:
                          description: primary button configuration
                          properties:
                            block:
                              description: when true, the primary button spans the whole action bar (antd Button `block`), with any other button stacked above it
                              type: boolean
                            icon:
                              description: icon name for primary button
                              type: string
                            label:
                              description: text label for primary button
                              type: string
                            size:
                              description: antd Button `size` of the primary button
                              enum:
                                - small
                                - middle
                                - large
                              type: string
                          type: object
                        review:
                          description: Configure-step button label when reviewBeforeSubmit is set (the button that opens the in-place Review; default 'Review →')
                          properties:
                            label:
                              description: text label for the Review button
                              type: string
                          type: object
                        reviewBack:
                          description: Review-step back button label when reviewBeforeSubmit is set (returns to editing; default '← Back to edit')
                          properties:
                            label:
                              description: text label for the back-to-edit button
                              type: string
                          type: object
                        secondary:
                          description: secondary button configuration
                          properties:
                            hidden:
                              description: when true, the secondary button (Reset, or the Cancel of `navigateTo`) is not shown
                              type: boolean
                            icon:
                              description: icon name for secondary button
                              type: string
                            label:
                              description: text label for secondary button
                              type: string
                            navigateTo:
                              description: when set, the secondary button is a Cancel that navigates to this route (SPA) instead of resetting the form
                              type: string
                          type: object
                      type: object
                    checkboxes:
                      description: boolean fields drawn as a Checkbox whose text is the field's label (its schema `title`, else its key), where a boolean is otherwise a Switch. The label is plain text; one phrase of it can be a link. A REQUIRED checkbox must be ticked to submit
                      items:
                        properties:
                          link:
                            description: 'one link in the label: the first occurrence of `text` in the label becomes a link to `href`, opened in a new tab (when `text` is not in the label, the link follows it)'
                            properties:
                              href:
                                description: an http(s) or mailto URL, or a path on the portal (`/…`), with no whitespace or control characters; any other is not drawn as a link
                                pattern: ^(https?://|mailto:|/([^/\\\s\x00-\x1f\x7f]|$))[^\s\x00-\x1f\x7f]*$
                                type: string
                              text:
                                description: the phrase of the label that is the link
                                type: string
                            required:
                              - href
                              - text
                            type: object
                          name:
                            description: the dotted path of a boolean field; an entry naming any other field is ignored
                            type: string
                          requiredMessage:
                            description: the message under a required checkbox left unticked
                            type: string
                        required:
                          - name
                        type: object
                      type: array
                    dependencies:
                      description: 'Configuration for the form fields who are dependent from other form fields. The field options are set via an API call made using a RESTAction which sould be defined below. The RESTActions shuold contain a `status` field, which is an array of object with the `{ label, value }` format. '
                      items:
                        properties:
                          closed:
                            description: 'true: only a listed value is accepted (a select); false: the list suggests and typed text is kept. Default true (the previous frontend rendered dependent fields as a select)'
                            type: boolean
                          dependsOn:
                            description: the field on which this field depends on
                            properties:
                              name:
                                description: the name of the field on which this field depends on
                                type: string
                            required:
                              - name
                            type: object
                          extra:
                            description: parameter to be added to the RESTAction call
                            properties:
                              key:
                                description: the key of the additional parameter
                                type: string
                            required:
                              - key
                            type: object
                          fallback:
                            description: '`manual`: a closed field whose options cannot be loaded (the RESTAction fails, or answers an empty list) takes a typed value instead of blocking the form'
                            enum:
                              - manual
                            type: string
                          name:
                            description: the name of the autocomplete field
                            type: string
                          resourceRefId:
                            description: the identifier of the RESTAction that should be called to retrieve dependency data
                            type: string
                        required:
                          - dependsOn
                          - extra
                          - name
                          - resourceRefId
                        type: object
                      type: array
                    disabled:
                      description: antd Form disabled (disables all fields)
                      type: boolean
                    displayingDependencies:
                      description: Configuration for the form fields whose displaying is dependent from other form fields.
                      items:
                        properties:
                          dependsOn:
                            description: the field on which this field depends on
                            properties:
                              conditionType:
                                description: '`notEmpty` (default) indicates that the current field is displayed if the dependency field has a non-empty value. `value` indicates that the current field is displayed only when the dependency field matches a specific value.'
                                enum:
                                  - notEmpty
                                  - value
                                type: string
                              name:
                                description: the name of the field on which this field depends on
                                type: string
                              value:
                                description: Expected value used when `type = value`.
                                properties:
                                  arrayValue:
                                    description: Value if type = array
                                    items:
                                      type: string
                                    type: array
                                  booleanValue:
                                    description: Value if type = boolean
                                    type: boolean
                                  integerValue:
                                    description: Value if type = integer
                                    type: integer
                                  optionValue:
                                    description: 'Value if type = option: includes a single value or a { label, value } object'
                                    properties:
                                      label:
                                        description: Label of the option
                                        type: string
                                      value:
                                        description: Value of the option. A number or a boolean is compared with type integer or boolean.
                                        type: string
                                    required:
                                      - value
                                    type: object
                                  stringValue:
                                    description: Value if type = string
                                    type: string
                                  type:
                                    description: Expected dependency value type.
                                    enum:
                                      - string
                                      - integer
                                      - boolean
                                      - array
                                      - option
                                      - 'null'
                                    type: string
                                required:
                                  - type
                                type: object
                            required:
                              - conditionType
                              - name
                            type: object
                          name:
                            description: the name of the field
                            type: string
                        required:
                          - dependsOn
                          - name
                        type: object
                      type: array
                    draftActionId:
                      description: optional id of an action fired by a 'Save draft' button that captures the CURRENT field values WITHOUT running form validation (so an incomplete form can be persisted). Pair with buttonConfig.draft to show the button.
                      type: string
                    fieldChecks:
                      description: 'fields checked against a same-origin endpoint as they are typed: after typing pauses and on blur, the field''s value (with `bodyExtras`) is POSTed as JSON and the answer becomes the field''s validation status and message. A newer value aborts the check in flight; an answer for an old value is never applied. An empty value, or one failing the field''s own rules, is not checked. While a check runs the field shows antd''s validating spinner, and a submit waits for that answer'
                      items:
                        properties:
                          answers:
                            description: what each answer means for the field, tried in order (first match wins)
                            items:
                              properties:
                                message:
                                  description: the message under the field; may name `{value}` (the checked value), `{body.<dotted>}` and `{retryAfter}`
                                  type: string
                                result:
                                  description: an antd Result that REPLACES the form (and its buttons). Its strings may name `{body.<dotted>}` (a value from the response, e.g. `{body.username}`), `{value}` (a checked field's value) and `{retryAfter}`; they are plain text, never markup
                                  properties:
                                    extra:
                                      description: the Result's actions, in order
                                      items:
                                        properties:
                                          href:
                                            description: an http(s) or mailto URL, or a path on the portal (`/…`, opened inside the app), with no whitespace or control characters; any other drops this action
                                            pattern: ^(https?://|mailto:|/([^/\\\s\x00-\x1f\x7f]|$))[^\s\x00-\x1f\x7f]*$
                                            type: string
                                          kind:
                                            description: '`button`: an antd primary Button; `link`: a plain link, after `text`'
                                            enum:
                                              - button
                                              - link
                                            type: string
                                          label:
                                            description: the button's or the link's text
                                            type: string
                                          text:
                                            description: plain text before a `link`, e.g. `Already have an account?`
                                            type: string
                                        required:
                                          - href
                                          - kind
                                          - label
                                        type: object
                                      type: array
                                    icon:
                                      description: an icon name, as buttonConfig takes them (e.g. `fa-envelope`), in place of the status icon
                                      type: string
                                    status:
                                      description: antd Result `status`
                                      enum:
                                        - success
                                        - info
                                        - warning
                                        - error
                                      type: string
                                    subtitle:
                                      description: antd Result `subTitle`
                                      type: string
                                    title:
                                      description: antd Result `title`
                                      type: string
                                  required:
                                    - status
                                    - title
                                  type: object
                                retryAfterMessage:
                                  description: 'the message instead of `message` when the answer carries a Retry-After of a positive number of seconds; `{retryAfter}` is that wait ("30 seconds", or whole minutes above 60: "2 minutes"), stated once, with no countdown'
                                  type: string
                                ruleFrom:
                                  description: a dotted path into the response body naming a rule, e.g. `rule`; its `ruleMessages` entry replaces `message`
                                  type: string
                                ruleMessages:
                                  additionalProperties:
                                    type: string
                                  description: rule → message, for `ruleFrom`
                                  type: object
                                validateStatus:
                                  description: the field's validation status for this answer (`warning` when absent). `error` blocks submitting, `warning` does not; `success` shows `message` as the field's help
                                  enum:
                                    - success
                                    - warning
                                    - error
                                  type: string
                                when:
                                  description: 'which answers this entry is for. Every condition given must hold; one left out matches anything. Entries are tried in order and the first match wins. An entry with no `when` matches every answer (entries after it are never reached). A request that got no answer (a network error, the client timeout) matches no entry: it is `otherwise`'
                                  properties:
                                    bodyField:
                                      description: a dotted path into the JSON response body, e.g. `status`; the entry matches only when that field is a string listed in `equals`
                                      type: string
                                    equals:
                                      description: the values `bodyField` may hold for this entry to match
                                      items:
                                        type: string
                                      type: array
                                    status:
                                      description: HTTP statuses, e.g. [429]
                                      items:
                                        maximum: 599
                                        minimum: 100
                                        type: integer
                                      type: array
                                  type: object
                              type: object
                            type: array
                          bodyExtras:
                            additionalProperties:
                              type: string
                            description: 'body key → the name of one of the page''s fragment extras (the keys its root declares in `krateo.io/fragment-keys`), e.g. `{ submission: s, token: t }`: those values are sent in the request BODY, never in a URL, and never enter the form. A key the page was not opened with is left out'
                            type: object
                          bodyKey:
                            description: the body key the value is sent under; the last segment of `name` when absent
                            type: string
                          debounceMs:
                            description: how long typing must pause before the check is sent, in milliseconds; 500 when absent. Blur sends it at once
                            maximum: 5000
                            minimum: 0
                            type: integer
                          name:
                            description: 'the dotted path of the field to check (a text-like field: not a boolean, object or list)'
                            type: string
                          otherwise:
                            description: the answer for anything no entry matched, a network error and the timeout; when absent, a warning "We couldn't check this right now."
                            properties:
                              message:
                                description: the message under the field; may name `{value}` (the checked value), `{body.<dotted>}` and `{retryAfter}`
                                type: string
                              result:
                                description: an antd Result that REPLACES the form (and its buttons). Its strings may name `{body.<dotted>}` (a value from the response, e.g. `{body.username}`), `{value}` (a checked field's value) and `{retryAfter}`; they are plain text, never markup
                                properties:
                                  extra:
                                    description: the Result's actions, in order
                                    items:
