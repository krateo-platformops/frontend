                        - vertical
                        - inline
                      type: string
                    propertiesToHide:
                      description: top-level schema property names to omit from the schema-driven form
                      items:
                        type: string
                      type: array
                    reviewBeforeSubmit:
                      description: when true (inline render only), the primary button validates and reveals an in-place read-only Review of the entered values before the real submit — the form stays mounted so 'Back to edit' preserves every value. Pair with buttonConfig.review / buttonConfig.reviewBack for custom labels.
                      type: boolean
                    schema:
                      description: 'JSON schema (e.g. a blueprint CRD''s openAPIV3Schema spec) rendered as form fields — the schema-driven alternative to `items`. Usually populated server-side via a widgetDataTemplate jq expression that extracts the spec schema. Note: a schema sourced from a CRD''s openAPIV3Schema has its `properties` map serialized alphabetically (order lost); use `stringSchema` to preserve the source values.schema.json authoring order.'
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    size:
                      description: antd Form size
                      enum:
                        - small
                        - middle
                        - large
                      type: string
                    stringSchema:
                      description: 'Same JSON schema as `schema`, but as a raw JSON STRING. Preferred over `schema` when present: the client JSON.parses it, preserving key insertion order, so fields render in the source values.schema.json order rather than the alphabetized order a CRD-sourced object schema yields. Typically populated server-side from the blueprint''s per-version jsonschema ConfigMap (which keeps authoring order). Falls back to `schema` when absent or not valid JSON.'
                      type: string
                    submitActionId:
                      description: the id of the action to be called when the form is submitted
                      type: string
                    submitActionSelector:
                      description: 'optional field-conditional submit routing: when present, the submit action is chosen at submit time from the value of the named field. Routes one form to different create targets (e.g. a ''target cluster'' select where ''local'' posts the blueprint instance and a remote spoke posts a RemoteInstall). Falls back to `default` (or `submitActionId`) when the field value has no mapping.'
                      properties:
                        default:
                          description: action id used when the field value is not present in `map`
                          type: string
                        field:
                          description: form field whose current value selects the submit action
                          type: string
                        map:
                          description: map of field-value → action id
                          type: object
                          additionalProperties:
                            type: string
                      required:
                        - field
                        - map
                      type: object
                    submitDisabledWhenPristine:
                      description: when true, the primary (submit) button stays disabled until at least one field differs from its initial value (initialValues overlaid on schema defaults). Use for update forms where submitting an unchanged value is a no-op — e.g. a version picker pre-set to the currently-installed version.
                      type: boolean
                  required:
