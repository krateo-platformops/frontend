                      type: boolean
                    draftActionId:
                      description: optional id of an action fired by a 'Save draft' button that captures the CURRENT field values WITHOUT running form validation (so an incomplete form can be persisted). Pair with buttonConfig.draft to show the button.
                      type: string
                    initialValues:
                      description: optional object with initial values for form fields. Keys should match form field names (supports nested objects). These values override schema defaults.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    items:
                      description: resourceRefIds of form-control widgets (Input, Select, Switch, …) to compose inside the Form. Composable mode — an alternative to the schema/stringSchema generator.
                      items:
                        properties:
                          resourceRefId:
                            description: the identifier of the form-control widget to render
                            type: string
                        required:
