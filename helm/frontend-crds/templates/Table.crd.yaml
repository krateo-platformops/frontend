apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tables.widgets.templates.krateo.io
spec:
  group: widgets.templates.krateo.io
  names:
    categories:
      - widgets
      - krateo
    kind: Table
    listKind: TableList
    plural: tables
    singular: table
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: 'The widget''s contract: its own data, an optional binding to a RESTAction, the resources it references, and any templated overrides.'
              properties:
                apiRef:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                    - namespace
                  type: object
                resourcesRefs:
                  properties:
                    items:
                      items:
                        properties:
                          apiVersion:
                            type: string
                          id:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                          payload:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          resource:
                            type: string
                          slice:
                            properties:
                              continue:
                                type: boolean
                              offset:
                                type: integer
                              page:
                                type: integer
                              perPage:
                                type: integer
                            required:
                              - perPage
                            type: object
                          verb:
                            enum:
                              - POST
                              - PUT
                              - PATCH
                              - DELETE
                              - GET
                            type: string
                        required:
                          - id
                        type: object
                      type: array
                    slice:
                      properties:
                        continue:
                          type: boolean
                        offset:
                          type: integer
                        page:
                          type: integer
                        perPage:
                          type: integer
                      required:
                        - perPage
                      type: object
                  required:
                    - items
                  type: object
                resourcesRefsTemplate:
                  items:
                    properties:
                      iterator:
                        type: string
                      template:
                        properties:
                          apiVersion:
                            type: string
                          id:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                          payload:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          resource:
                            type: string
                          verb:
                            enum:
                              - POST
                              - PUT
                              - PATCH
                              - DELETE
                              - GET
                            type: string
                        required:
                          - id
                        type: object
                    type: object
                  type: array
                widgetData:
                  description: The properties Table renders. Where Table wraps an antd component these are antd's own prop names, so antd's documentation for that component describes them.
                  properties:
                    actions:
                      description: the actions of the widget (canonical map; see src/schemas/actions.schema.json). Referenced per-row by rowActions.
                      properties:
                        navigate:
                          description: client-side navigation actions
                          items:
                            properties:
                              id:
                                description: unique identifier for the action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              path:
                                description: the identifier of the route to navigate to
                                type: string
                              requireConfirmation:
                                description: whether user confirmation is required before navigating
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              type:
                                description: type of navigation action
                                enum:
                                  - navigate
                                type: string
                            required:
                              - id
                              - type
                            type: object
                          type: array
                        openDrawer:
                          description: actions to open side drawer components
                          items:
                            properties:
                              id:
                                description: unique identifier for the drawer action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              requireConfirmation:
                                description: whether user confirmation is required before opening
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              size:
                                description: drawer size to be displayed
                                enum:
                                  - default
                                  - large
                                type: string
                              title:
                                description: title shown in the drawer header
                                type: string
                              type:
                                description: type of drawer action
                                enum:
                                  - openDrawer
                                type: string
                            required:
                              - id
                              - resourceRefId
                              - type
                            type: object
                          type: array
                        openModal:
                          description: actions to open modal dialog components
                          items:
                            properties:
                              customWidth:
                                description: the custom width of the value, which should be used by setting the 'custom' value inside the 'size' property
                                type: string
                              id:
                                description: unique identifier for the modal action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              requireConfirmation:
                                description: whether user confirmation is required before opening
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              size:
                                description: sets the Modal size, 'default' is 520px, 'large' is 80% of the screen width, 'fullscreen' is 100% of the screen width, 'custom' should be used with the 'customWidth' property
                                enum:
                                  - default
                                  - large
                                  - fullscreen
                                  - custom
                                type: string
                              title:
                                description: title shown in the modal header
                                type: string
                              type:
                                description: type of modal action
                                enum:
                                  - openModal
                                type: string
                            required:
                              - id
                              - resourceRefId
                              - type
                            type: object
                          type: array
                        rest:
                          description: rest api call actions triggered by the widget
                          items:
                            properties:
                              errorMessage:
                                description: a message that will be displayed inside a toast in case of error
                                type: string
                              fanOutPath:
                                description: 'name of an ARRAY field in the submitted values: the action fans out into ONE ordered write per element (for each write, that field is replaced by the single element before payload/payloadToOverride interpolation). The whole set is gated behind ONE aggregated blast-radius confirm and dispatched sequentially with stop-on-first-error and per-item results (W0-4 applySet semantics); onEventNavigateTo is not supported on a fan-out action'
                                type: string
                              headers:
                                description: 'array of headers as strings, format ''key: value'''
                                items:
                                  description: 'key and value as a single, example: ''x-custom-header: value'''
                                  type: string
                                type: array
                              id:
                                description: unique identifier for the action
                                type: string
                              loading:
                                description: Whether this action shows an in-flight indicator while it runs.
                                properties:
                                  display:
                                    description: Show the in-flight indicator. Set false to run the action without one.
                                    type: boolean
                                required:
                                  - display
                                type: object
                              onEventNavigateTo:
                                description: conditional navigation triggered by a specific event
                                properties:
                                  eventReason:
                                    description: identifier of the awaited event reason
                                    type: string
                                  loadingMessage:
                                    description: message to display while waiting for the event
                                    type: string
                                  reloadRoutes:
                                    description: Re-fetch the route table before navigating. Set it when the action creates its own destination — publishing a new page, for example — so the route exists by the time the navigation happens.
                                    type: boolean
                                  timeout:
                                    default: 50
                                    description: the timeout in seconds to wait for the event
                                    type: integer
                                  url:
                                    description: url to navigate to when the event is received
                                    type: string
                                required:
                                  - eventReason
                                  - url
                                type: object
                              onSuccessNavigateTo:
                                description: url to navigate to after successful execution
                                type: string
                              ops:
                                description: 'ordered list of DISTINCT writes applied as ONE gated set (e.g. one Form submit creating a Role AND its RoleBinding): each op resolves its OWN resourceRefId (verb + path + payload base) and builds its OWN payload/payloadToOverride against the SAME submitted values. The whole set is gated behind ONE aggregated blast-radius confirm and dispatched sequentially with stop-on-first-error and per-item results (W0-4 applySet semantics). Mutually exclusive with fanOutPath; onEventNavigateTo is not supported on a multi-op action. The action''s own top-level payload/payloadToOverride are IGNORED when ops is present and its top-level resourceRefId is ignored for dispatch (it must still name a valid resource ref — point it at the first op''s)'
                                items:
                                  properties:
                                    payload:
                                      description: static payload sent with this op's request
                                      type: object
                                      x-kubernetes-preserve-unknown-fields: true
                                    payloadToOverride:
                                      description: list of this op's payload fields to override dynamically (values interpolate against the same submitted values as every other op)
                                      items:
                                        properties:
                                          name:
                                            description: name of the field to override
                                            type: string
                                          value:
                                            description: value to use for overriding the field
                                            type: string
                                        required:
                                          - name
                                          - value
                                        type: object
                                      type: array
                                    resourceRefId:
                                      description: 'the identifier of the resource ref this op targets: its verb (must be mutating), path and payload base'
                                      type: string
                                  required:
                                    - resourceRefId
                                  type: object
                                type: array
                              payload:
                                description: static payload sent with the request
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              payloadToOverride:
                                description: list of payload fields to override dynamically
                                items:
                                  properties:
                                    name:
                                      description: name of the field to override
                                      type: string
                                    value:
                                      description: value to use for overriding the field
                                      type: string
                                  required:
                                    - name
                                    - value
                                  type: object
                                type: array
                              requireConfirmation:
                                description: whether user confirmation is required before triggering the action
                                type: boolean
                              resourceRefId:
                                description: the identifier of the k8s custom resource that should be represented
                                type: string
                              successMessage:
                                description: a message that will be displayed inside a toast in case of success
                                type: string
                              type:
                                description: type of action to execute
                                enum:
                                  - rest
                                type: string
                            required:
                              - headers
                              - id
                              - resourceRefId
                              - type
                            type: object
                          type: array
                      type: object
                    allowedResources:
                      description: the resource plurals this container may hold as children. The enum is what this KIND can ever hold, by role. WHICH of them this instance accepts is its own declaration, checked against its real children by the X5 lint. Empty means unconstrained.
                      items:
                        type: string
                        enum:
                          - barcharts
                          - buttongroups
                          - buttons
                          - filters
                          - flowcharts
                          - linecharts
                          - markdowns
                          - paragraphs
                          - piecharts
                          - rangepickers
                          - yamlviewers
                      type: array
                    bordered:
                      description: antd Table bordered
                      type: boolean
                    columns:
                      description: configuration of the table's columns
                      items:
                        properties:
                          color:
                            description: the color of the value (or the icon) to be represented. These are KRATEO PALETTE names resolved through the shared palette — not antd presets. The same name on a Button takes antd's vocabulary instead and renders a different shade.
                            enum:
                              - blue
                              - darkBlue
                              - orange
                              - gray
                              - red
                              - green
                              - violet
                            type: string
                          minWidth:
                            description: 'antd Table column minWidth in px. Mirrors antd ColumnType.minWidth. Usually the better lever under fitContent: a fixed width re-creates the overflow it was meant to fix, while a floor keeps a column readable and lets the others flex.'
                            type: integer
                          title:
                            description: column header label
                            type: string
                          valueKey:
                            description: key used to extract the value from row data
                            type: string
                          width:
                            description: 'antd Table column width — a pixel number, or any CSS length string. Mirrors antd ColumnType.width. Optional: omitted, antd sizes the column as it does today.'
                            x-kubernetes-int-or-string: true
                        required:
                          - title
                          - valueKey
                        type: object
                      type: array
                    dataSource:
                      description: antd Table dataSource — the table rows (renamed from `data`; `data` still accepted for back-compat)
                      items:
                        description: Row represented as array of cells
                        items:
                          properties:
                            arrayValue:
                              description: value if type = array
                              items:
                                type: string
                              type: array
                            booleanValue:
                              description: value if type = boolean
                              type: boolean
                            color:
                              description: per-cell color — a KRATEO PALETTE name (gray, red, orange, green, blue, primary…), resolved for the light or dark mode; never a hex, which is one value in both modes. On a jsonSchemaType cell it overrides the column color, and a value that is not a palette name is applied as CSS as written. Lets each row carry its own color (e.g. status).
                              type: string
                            decimalValue:
                              description: value if type = number or decimal
                              type: string
                            format:
                              description: optional display format for a string value — `relative` (e.g. "14d ago"), `date`, or `datetime`. The raw value stays in the data; only the rendering changes.
                              enum:
                                - relative
                                - date
                                - datetime
                              type: string
                            kind:
                              description: type of cell value. `tag` renders the stringValue as a colored antd Tag (use the cell `color`). `bar` renders a reconciliation-rail Progress gauge (stringValue = percent 0-100, `color` = bar/state color, amber target-tick at 100%). `conditions` renders `arrayValue` (an array of {type,status}) as small status pills, each coloured cyan (True) / crimson (False).
                              enum:
                                - jsonSchemaType
                                - icon
                                - widget
                                - tag
                                - bar
                                - conditions
                              type: string
                            numberValue:
                              description: value if type = number or integer
                              type: integer
                            resourceRefId:
                              description: used if kind = widget
                              type: string
                            stringValue:
                              description: value if type = string
                              type: string
                            tooltip:
                              description: optional antd Tooltip text for this cell, shown on hover and on keyboard focus, for every cell kind (e.g. a span's OTel StatusMessage on its error tag). When set, it replaces the cell's own full-text-on-hover title, so a cell never shows two tooltips. Omitted or empty, the cell renders exactly as without it.
                              type: string
                            type:
                              description: used if kind = jsonSchemaType
                              enum:
                                - string
                                - number
                                - integer
                                - decimal
                                - boolean
                                - array
                                - 'null'
                              type: string
                            valueKey:
                              description: the key of the column this cell belongs to
                              type: string
                          required:
                            - kind
                            - valueKey
                          type: object
                        type: array
                      type: array
                    fitContent:
                      description: 'Fit columns to the container instead of horizontal-scrolling: a wide cell ellipsis-truncates (full text on hover) rather than pushing a scrollbar. Ignored for virtualized (very large) tables.'
                      type: boolean
                    pagination:
                      description: antd Table pagination config (subproperties mirror antd).
                      properties:
                        current:
                          description: 'server-side pagination: the 1-based current page (controlled). Usually driven by the request `page` param, not the CR.'
                          type: integer
                        defaultPageSize:
                          description: default page size
                          type: integer
                        hideOnSinglePage:
                          description: hide the pager when there is a single page
                          type: boolean
                        pageSize:
                          description: number of rows per page
                          type: integer
                        position:
                          description: pager position(s)
                          items:
                            enum:
                              - topLeft
                              - topCenter
                              - topRight
                              - bottomLeft
                              - bottomCenter
                              - bottomRight
                            type: string
                          type: array
                        simple:
                          description: use the simple pager
                          type: boolean
                        total:
                          description: 'server-side pagination: the TOTAL row count across all pages (the widget''s `dataSource` holds only the current page/window). Set by the widgetDataTemplate from the full list length so the pager renders the correct number of pages. When present, the Table uses controlled server-side pagination (each page fetched on demand) instead of client-side slicing of dataSource.'
                          type: integer
                      type: object
                    prefix:
                      description: it's the filters prefix to get right values
                      type: string
                    resizableColumns:
                      description: Whether the reader can resize the columns by dragging the right edge of a header (or with the arrow keys on its handle). On when omitted; set false to keep the columns at the widths the table lays out. Widths a reader set are remembered per viewer in the browser, and ignored while this is false.
                      type: boolean
                    rowActions:
                      description: 'per-row action controls, rendered in a trailing column of each row as a kebab (⋯) menu or as buttons (see rowActionsDisplay) — the same field List takes as itemTemplate.rowActions. Each entry references an action id from widgetData.actions and is fired with the row''s values as the action payload (customPayload): an object of each cell''s valueKey to its value, so a navigate path of /x/${name} goes to that row''s `name` cell. A click or key on a control never fires the row''s rowNavigateTo, which keeps working everywhere else on the row.'
                      items:
                        properties:
                          actionId:
                            description: id of an action defined in widgetData.actions to fire when this menu item is clicked
                            type: string
                          danger:
                            description: render the menu item in a destructive (red) style
                            type: boolean
                          icon:
                            description: optional Font Awesome icon name for the menu item
                            type: string
                          label:
                            description: menu item label
                            type: string
                        required:
                          - actionId
                          - label
                        type: object
                      type: array
                    rowActionsDisplay:
                      description: 'how rowActions are presented: menu (a kebab (⋯) in the row''s last cell, default) | buttons (antd Buttons in the row''s last cell, in declared order: the first primary, the rest default, a danger entry as danger). The whole-row click (rowNavigateTo) is unchanged either way. Same field and values as List''s itemTemplate.rowActionsDisplay.'
                      enum:
                        - menu
                        - buttons
                      type: string
                    rowNavigateTo:
                      description: optional route path to navigate to on row click; `{valueKey}` placeholders are filled from that row's cells (e.g. /compositions/{ns}/{name})
                      type: string
                    size:
                      description: antd Table size. Defaults to 'middle' when omitted (matching Button), so an unset value has a documented, Brand-consistent density rather than antd's raw default
                      enum:
                        - large
                        - middle
                        - small
                      type: string
                    watch:
                      description: 'live-refresh watch: involvedObject(s) this widget is tied to (see src/schemas/watch.schema.json). A matching k8s event refetches the widget.'
                      items:
                        properties:
                          apiVersion:
                            description: group/version, e.g. composition.krateo.io/v1alpha1
                            type: string
                          kind:
                            description: e.g. DemoClaim
                            type: string
                          name:
                            description: a specific object; omit to match any object of this kind ("GVR-level")
                            type: string
                          namespace:
                            description: scope to a namespace; omit to match any
                            type: string
                        required:
                          - apiVersion
                          - kind
                        type: object
                      type: array
                  required:
                    - allowedResources
                    - columns
                  type: object
                widgetDataTemplate:
                  items:
                    properties:
                      expression:
                        type: string
                      forPath:
                        type: string
                    type: object
                  type: array
                identityContext:
                  items:
                    enum:
                      - username
                      - groups
                    type: string
                  type: array
                keyExtras:
                  description: 'F6 (snowplow#130): the request-extras keys (route params / URL query folded into ?extras=) whose values this widget''s resolution depends on. Only declared keys partition the widget cache cell. Absent/empty = the widget does not vary by any request extra (chrome/layout default).'
                  items:
                    type: string
                  type: array
                freshness:
                  description: 'Opt-in staleness indicator: when true the widget shows the stale/refreshing dot overlay (exception states only). Absent/false = no badge ever (the default; healthy widgets stay unmarked).'
                  type: boolean
              required:
                - widgetData
              type: object
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
          type: object
      served: true
      storage: true
      subresources:
        status: {}
status:
  acceptedNames:
    kind: ''
    plural: ''
  conditions: null
  storedVersions: null
