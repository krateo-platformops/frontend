                        type: object
                    type: object
                  type: array
                widgetData:
                  description: The properties Alert renders. Where Alert wraps an antd component these are antd's own prop names, so antd's documentation for that component describes them.
                  properties:
                    banner:
                      description: render as a full-width banner
                      type: boolean
                    closable:
                      description: whether the alert can be dismissed
                      type: boolean
                    description:
                      description: the alert detail text
                      type: string
                    details:
                      description: the full message, folded inside the alert under a collapsed "Details" disclosure; plain text, line breaks kept. Omit it for no disclosure.
                      type: string
                    rows:
                      description: short lines drawn inside the alert's box under the description, as a compact list, one per entry; plain text. The widget has no length limit of its own, the page decides how many to send. Omit it for no list.
                      items:
                        type: string
                      type: array
                    rowsFold:
                      description: fold the rows under a disclosure button with this label instead of drawing them straight away. Omit it and the rows are always shown, with no disclosure. The page decides when to fold; the widget has no threshold.
                      properties:
                        label:
                          description: the disclosure button's text, for example `Show the 14 fields`
                          type: string
                        open:
                          description: whether the rows start expanded. Default false.
                          type: boolean
                      required:
                        - label
                      type: object
                    rowsMonospace:
                      description: draw the rows in the monospace font, for paths, keys and other identifiers. Default false.
                      type: boolean
                    showIcon:
                      description: whether to show the severity icon
                      type: boolean
                    tag:
                      description: a short reason drawn beside the title as a tag in the alert's own type colour, for example `CrashLoopBackOff`. Omit it for no tag.
                      type: string
                    title:
                      description: the alert title
                      type: string
                    type:
                      description: the alert severity
                      enum:
                        - success
                        - info
                        - warning
                        - error
                      type: string
                  required:
                    - title
                  type: object
                widgetDataTemplate:
                  items:
                    properties:
                      expression:
