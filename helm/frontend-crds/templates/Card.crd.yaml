                widgetData:
                  properties:
                    anchorId:
                      description: renders this panel with a DOM id so an in-page `[text](#anchorId)` link (e.g. a summary/table-of-contents Markdown widget) scrolls to it
                      type: string
                    clickActionId:
                      description: the id of the action to be executed when the panel is clicked
                      type: string
                    cover:
                      description: resourceRefId of a widget rendered as the antd Card cover
                      type: string
                    extra:
                      description: antd Card extra — content shown top-right of the card header (renamed from `headerRight`)
                      type: string
                    extraRefId:
                      description: resourceRefId of a widget (e.g. a Button) rendered top-right of the card header — a real, independently-actioned slot with its own icon/size/navigation, distinct from the plain-text `extra`. Mirrors the `cover`/`footer` widget slots; renders a nested WidgetRenderer, so it does NOT make the whole card the click target the way `extra` + `clickActionId` does.
