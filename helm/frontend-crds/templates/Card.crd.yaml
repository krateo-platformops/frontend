                        - processing
                        - warning
                        - error
                        - default
                        - green
                        - gold
                        - red
                        - blue
                        - violet
                      type: string
                    extraVariant:
                      description: 'how `extra` renders top-right: `text` (default, plain), `badge` (glow dot + uppercase mono, for CONVERGED/DRIFT/DEGRADED), or `tag` (soft antd Tag pill — for Up to date / status labels)'
