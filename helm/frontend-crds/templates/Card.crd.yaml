                    legend:
                      description: 'optional legend key shown top-right of the card header (e.g. the reconciliation-rail actual/drift/target swatches): each item is a small colour swatch + label'
                      items:
                        properties:
                          color:
                            description: swatch colour (palette name, e.g. cyan / magenta / amber)
                            type: string
                          label:
                            description: swatch label (e.g. actual / drift / target)
                            type: string
