                  description: '@ant-design/charts Column config (AntV G2)'
                  properties:
                    axis:
                      description: G2 per-channel axis config (G2 `axis`), e.g. {"x":{"tickCount":6},"y":{"tickCount":4}}
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    colorField:
                      description: field mapped to color / series (G2 `colorField`)
                      type: string
                    colorMap:
                      additionalProperties:
                        type: string
                      description: map each colorField category to a Krateo palette colour name (e.g. {"Created":"cyan"}); sets the G2 color scale domain/range so the bars render in the brand colour, not G2's default blue palette
                      type: object
                    data:
