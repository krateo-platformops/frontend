                  description: the data that will be passed to the widget on the frontend
                  properties:
                    allowedResources:
                      description: the resource plurals this container may hold as children. Typed loosely on purpose — the per-widget enums drifted and enforced nothing; containment is checked by the chart lint (design rule X5) against the real widget registry.
                      items:
                        type: string
                      type: array
                    counter:
                      description: an optional count rendered in brackets beside the title, on the title's own type step (e.g. '(397)'). Use for 'how many of these are there', never for a status
                      format: int32
                      type: integer
                    counterLabel:
                      description: the noun the counter counts, rendered inside the same brackets (e.g. '23 blueprints'). Use it when WHAT is being counted changes — a bare '(23)' beside a filtered catalog does not say 23 of what
                      type: string
                    items:
                      description: 'the page''s actions, rendered right-aligned on the title line. At most one should be `type: primary`'
