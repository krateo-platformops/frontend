{{- /*
One gate per instance: Deployment, Service, and the RemoteMCPServer kagent resolves the agent's
validate_draft toolName against. The server is stateless (a fresh MCP transport per request), so
a restart never strands a session.
*/ -}}
{{- /*
REFUSE AN INSTALL THAT WOULD DEPLOY NOTHING.

Every object below is inside `range .Values.instances`, and `instances` defaults to []. So an
install that forgets it rendered ZERO objects: helm reported success, the release looked healthy,
and no gate existed. That is indistinguishable from a working install by every signal an operator
would check, and it is how this chart sat published-and-uninstalled for two releases while
`validate_draft` judged nothing.

An empty list is always a mistake here — a chart whose only purpose is to run gates has no meaning
with no gates — so it fails loudly instead.
*/ -}}
{{- if not .Values.instances }}
{{- fail "builder-gate: .Values.instances is empty, so this chart would render NOTHING and report success. Declare one entry per authoring agent, e.g. instances: [{name: portal-builder, builders: [portal-builder]}]. Each entry needs `name` and `builders`." }}
{{- end }}

{{- /*
AND ASSERT EACH INSTANCE'S BUILDERS EXIST — but only where that question is answerable.

The RBAC below narrows to the named Builders, so a typo produces a gate with permission to read a
Builder that is not there: it starts, serves `validate_draft`, and fails every call for a reason
that looks like the caller's fault. The lookup turns that into an install-time error.

GUARDED ON CAPABILITIES, DELIBERATELY. `helm template` disables `lookup` (it returns empty) and
carries only built-in API versions, so an unguarded assert would fail every render in CI and every
`helm template` a human runs. Keying on `.Capabilities.APIVersions.Has` means the assert runs when
we are talking to a cluster that serves the kind — where an empty lookup really does mean absent —
and is skipped where emptiness carries no information.

The group is doubled and that is not a typo: the CRD is `builders.builders.templates.krateo.io`,
plural `builders` in group `builders.templates.krateo.io`. Reading it as `templates.krateo.io`
resolves to a group that does not exist and answers nothing, which produced a confident "there are
zero Builders" about three that are 28 days old.
*/ -}}
{{- $group := "builders.templates.krateo.io/v1alpha1" }}
{{- if .Capabilities.APIVersions.Has $group }}
{{- range $instance := .Values.instances }}
{{- range $builder := $instance.builders }}
{{- if not (lookup $group "Builder" $.Values.buildersNamespace $builder) }}
{{- fail (printf "builder-gate: instance %q names Builder %q, which does not exist in namespace %q. The gate's RBAC would grant access to a Builder that is not there, and every validate_draft call for it would fail as if the caller were at fault. List the real ones with: kubectl get builders.builders.templates.krateo.io -n %s" ($instance.name | toString) ($builder | toString) $.Values.buildersNamespace $.Values.buildersNamespace) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- range .Values.instances }}
{{- $name := include "builder-gate.name" . }}
{{- $ctx := dict "root" $ "instance" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "builder-gate.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "builder-gate.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.Version }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GATE_BUILDERS
              value: {{ join "," .builders | quote }}
            - name: BUILDERS_NAMESPACE
              value: {{ $.Values.buildersNamespace | quote }}
            - name: SANDBOX_NAMESPACE
              value: {{ $.Values.sandboxNamespace | quote }}
            - name: SNOWPLOW_URL
              value: {{ $.Values.snowplowUrl | quote }}
          # The gate needs nothing remote to be alive; an unreachable API server is a verdict
          # inside the envelope, not a dead pod. The liveness budget (15 s x 8) is longer than the
          # tool's 100 s deadline, so the tool's own deadline always fires first.
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /readyz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "builder-gate.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $name }}
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
{{- if $.Values.remoteMCPServer.enabled }}
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "builder-gate.labels" $ctx | nindent 4 }}
spec:
  description: "Krateo builder gate for {{ .name }} ({{ join ", " .builders }}): validate_draft runs the portal's own lint (with its secrets rule), reference checks and snowplow's jq compiler, then, through snowplow as the caller, a dry-run of every object (dryRun=All, fieldValidation=Strict) and each draft RESTAction resolved without being stored"
  protocol: STREAMABLE_HTTP
  url: http://{{ $name }}.{{ $.Release.Namespace }}:8080/mcp
  timeout: {{ $.Values.remoteMCPServer.timeout }}
{{- end }}
{{- end }}
