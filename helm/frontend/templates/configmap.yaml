apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config-vars
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  config.json: |
    {"api":{
{{- /* Effective config: when the chart provisions the preview sandbox, PREVIEW_SANDBOX_NAMESPACE
       is forced to previewSandbox.namespace so config and provisioning cannot drift.
       Disabled (default): the plain values.config passes through (empty string = feature OFF). */ -}}
{{- $config := deepCopy .Values.config -}}
{{- if .Values.previewSandbox.enabled -}}
{{- $_ := set $config "PREVIEW_SANDBOX_NAMESPACE" .Values.previewSandbox.namespace -}}
{{- end -}}
{{- /* Agentiko keys under both names (the Autopilot -> Agentiko rename). Every AUTOPILOT_<KEY> has an
       AGENTIKO_<KEY> name; values may set either, and config.json carries BOTH with one value, so
       a frontend that reads only the old names keeps working while the new names roll out.
       AGENTIKO_<KEY> wins whenever values set it, an empty string included; otherwise the
       AUTOPILOT_<KEY> value is copied to the new name. values.yaml defaults only the AUTOPILOT_
       names, so an installer that overrides only those still decides the value.
       Remove the AUTOPILOT_ half once every cluster sets the AGENTIKO_ names. */ -}}
{{- range $k := keys $config | sortAlpha -}}
{{- if hasPrefix "AGENTIKO_" $k -}}
{{- $_ := set $config (printf "AUTOPILOT_%s" (trimPrefix "AGENTIKO_" $k)) (get $config $k) -}}
{{- end -}}
{{- end -}}
{{- range $k := keys $config | sortAlpha -}}
{{- if hasPrefix "AUTOPILOT_" $k -}}
{{- $current := printf "AGENTIKO_%s" (trimPrefix "AUTOPILOT_" $k) -}}
{{- if not (hasKey $config $current) -}}
{{- $_ := set $config $current (get $config $k) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Agent gateway on: the API base URL arrives as the gateway's origin (installer exposure
       model), and the A2A path for this namespace is appended here, under both names. Skipped
       for a relative value, so an unresolved origin degrades to the kagent-ui proxy path. */ -}}
{{- if .Values.agentgateway.enabled -}}
{{- $gw := $config.AGENTIKO_API_BASE_URL | default "" | toString -}}
{{- if hasPrefix "http" $gw -}}
{{- $a2a := printf "%s/api/a2a/%s/autopilot" (trimSuffix "/" $gw) .Release.Namespace -}}
{{- $_ := set $config "AGENTIKO_API_BASE_URL" $a2a -}}
{{- $_ := set $config "AUTOPILOT_API_BASE_URL" $a2a -}}
{{- end -}}
{{- end -}}
{{- $local := dict "first" true -}}
{{- range $k, $v := $config -}}
{{- if not $local.first -}},{{- end -}}
{{- if kindIs "string" $v }}
  {{ quote $k | indent 6 }}: {{ quote $v }}
{{- else }}
  {{ quote $k | indent 6 }}: {{ $v }}
{{- end }}
{{- $_ := set $local "first" false -}}
{{- end -}}
    },
    "params":{
      "FRONTEND_NAMESPACE": "{{ .Release.Namespace }}",
      "DELAY_SAVE_NOTIFICATION": "10000"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}