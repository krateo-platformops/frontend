apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config-vars
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  config.json: |
    {"api":{
{{- /* Effective config: when the chart provisions the preview sandbox, PREVIEW_SANDBOX_NAMESPACE
       is forced to previewSandbox.namespace so config and provisioning cannot drift.
       Disabled (default): the plain values.config passes through (empty string = feature OFF). */ -}}
{{- $config := deepCopy .Values.config -}}
{{- if .Values.previewSandbox.enabled -}}
{{- $_ := set $config "PREVIEW_SANDBOX_NAMESPACE" .Values.previewSandbox.namespace -}}
{{- end -}}
{{- /* Agent gateway on: AUTOPILOT_API_BASE_URL arrives as the gateway's origin (installer
       exposure model), and the A2A path for this namespace is appended here. Skipped for a
       relative value, so an unresolved origin degrades to the kagent-ui proxy path. */ -}}
{{- if .Values.agentgateway.enabled -}}
{{- $gw := $config.AUTOPILOT_API_BASE_URL | default "" | toString -}}
{{- if hasPrefix "http" $gw -}}
{{- $_ := set $config "AUTOPILOT_API_BASE_URL" (printf "%s/api/a2a/%s/autopilot" (trimSuffix "/" $gw) .Release.Namespace) -}}
{{- end -}}
{{- end -}}
{{- $local := dict "first" true -}}
{{- range $k, $v := $config -}}
{{- if not $local.first -}},{{- end -}}
{{- if kindIs "string" $v }}
  {{ quote $k | indent 6 }}: {{ quote $v }}
{{- else }}
  {{ quote $k | indent 6 }}: {{ $v }}
{{- end }}
{{- $_ := set $local "first" false -}}
{{- end -}}
    },
    "params":{
      "FRONTEND_NAMESPACE": "{{ .Release.Namespace }}",
      "DELAY_SAVE_NOTIFICATION": "10000"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}