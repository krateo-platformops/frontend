# Default values for frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global values shared across (sub)charts.
global:
  # Optional registry-host override applied to EVERY image (mirror / air-gapped installs).
  # When set, it replaces the per-image `registry` host; repository paths are preserved.
  imageRegistry: ""

replicaCount: 1

image:
  registry: ghcr.io
  repository: krateo-platformops/frontend
  pullPolicy: IfNotPresent
  # Empty -> the chart appVersion (= APP_VERSION = latest tag of the frontend app repo), so the
  # chart always deploys the image the app fork actually built. Override here to pin a tag.
  tag: ""

imagePullSecrets: []
nameOverride: "frontend"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  port: 8080
  # nodePort: <30000-32767>  # set by installer for NodePort exposure (only honored when type=NodePort)

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Probe tolerances are explicit because the Kubernetes defaults (timeoutSeconds: 1,
# failureThreshold: 3) are too twitchy under CPU contention: a healthy pod that misses
# the 1s deadline three times gets killed, and since the frontend serves the whole
# portal UI, every restart is a visible dead-portal window — and restart storms only
# worsen the contention that caused them. Liveness is lenient (~60s of unresponsiveness
# before a restart — only truly dead processes get killed); readiness keeps the default
# failureThreshold so a genuinely slow pod still drops from endpoints promptly, but
# with a 5s timeout so load alone doesn't flap it.
livenessProbe:
  httpGet:
    path: /
    port: http
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /
    port: http
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# An agentgateway data plane in front of kagent (krateo-agentiko/agentgateway-policies) that
# validates the caller's JWT and forwards it down. The portal always sends the logged-in user's
# Bearer on its Autopilot A2A calls; when enabled, those calls go to the GATEWAY instead of to
# kagent-ui, so the token is actually validated and the gateway's per-user agent/tool/delegation
# RBAC applies. Off, they keep going to kagent-ui through the nginx `/autopilot/` proxy.
#
# `enabled` turns `config.AUTOPILOT_API_BASE_URL` from the gateway's ORIGIN into the full A2A URL
# for this release's namespace — the installer supplies that origin the same way it supplies the
# snowplow/authn/events ones (exposure model), so the browser calls the gateway directly, exactly
# like every other Krateo backend. A relative value (the chart default `/autopilot`) is left alone,
# so a not-yet-resolved origin degrades to the old path instead of rendering a broken URL.
#
# Needs `cors.enabled` on the gateway (the installer's features.agentGateway sets both): a
# cross-origin browser call is preceded by an unauthenticated OPTIONS preflight that the gateway's
# authorization policy would otherwise 403. And only meaningful when the kagent controller runs
# with `controller.auth.mode=trusted-proxy`, or the identity in the token is ignored.
# Off is byte-identical to a chart without this key.
agentgateway:
  enabled: false

config:
  SNOWPLOW_API_BASE_URL: http://localhost:8081
  AUTHN_API_BASE_URL: http://localhost:8082
  EVENTS_PUSH_API_BASE_URL: http://localhost:8083
  EVENTS_API_BASE_URL: http://localhost:8083
  # Autopilot copilot. Default: the same-origin path served by the nginx `location /autopilot/`
  # reverse proxy to kagent-ui (no cross-origin → no CORS). The rail renders only when this is set.
  # With `agentgateway.enabled` this is instead the agent gateway's ORIGIN (e.g.
  # http://gateway.example.com:8080) and the chart appends the A2A path — so set the origin only.
  AUTOPILOT_API_BASE_URL: /autopilot
  # Autopilot availability. Controls CLICKABILITY of the header toggle, NOT its visibility (the
  # toggle stays visible whenever AUTOPILOT_API_BASE_URL is set, so the capability is discoverable).
  # "" (default) leaves clickability to the frontend's runtime reachability probe of the endpoint.
  # The installer sets this to "false" when agents are not deployed (features.coreAgents=false), which
  # grays the toggle out + makes it non-clickable (with a tooltip) instead of a dead click that 502s.
  AUTOPILOT_AVAILABLE: ""
  # Entry point: the app-shell Layout (antd-pure INIT→Layout convention).
  # NavMenu + RoutesLoader were removed (#15/#18) — routing is data via the sidebar Menu.
  INIT: /call?resource=layouts&apiVersion=widgets.templates.krateo.io/v1beta1&name=app-shell&namespace=krateo-system
  # Browser OpenTelemetry collector endpoint. Empty by default: the browser OTel
  # SDK stays OFF until a non-empty endpoint is set (frontend gates on config.api.OTEL_COLLECTOR_URL).
  OTEL_COLLECTOR_URL: ""
  # Capability flag (chart-authored, NOT an operator knob) — STRING-typed on purpose: the krateo
  # installer's config plumbing (chart-inspector) emits only strings, and a boolean field wedges the
  # krateofrontends composition version migration (v1-1-8 -> v1-2-0). Pinned to string in
  # gen-config-schema.py TYPE_OVERRIDES. The frontend runtime coerces it via JS truthiness
  # (injectIdentity = !config.api.SNOWPLOW_IDENTITY_INJECTION):
  #   ""/absent → falsy → inject ON  = LEGACY (frontend volunteers identity in ?extras=). Shipped
  #                                    ROLLOUT HOLD-OFF, safe-by-default.
  #   "true"    → truthy → inject OFF = frontend stops volunteering; snowplow injects server-side.
  # The flip to "true" is the LAST rollout step (A6 §6), driven by the installer AFTER portal 1.5.0's
  # identityContext declarations land — so the chart ships "" (hold-off), not "true". ("false" is a
  # trap: JS !"false" is falsy, so "false" would mean inject OFF — never set it; use "" for hold-off.)
  # See snowplow docs/frontend-1.2.0-config-type-conflict-spec-2026-07-07.md + A6 §1.2/§4.1.
  SNOWPLOW_IDENTITY_INJECTION: ""
  # W0-3 provenance: emits one AuditRecord (audit.krateo.io) per gated portal write (human or
  # agent) — the audit + remediation-outcome loop depends on it. Default ON (only explicit
  # "false" disables; "" also resolves ON in the frontend). Needs the AuditRecord CRD (portal chart).
  PROVENANCE_ENABLED: "true"
  # Portal-builder live preview (previewPage v2): the namespace the frontend applies
  # draft widget CRs into and renders them from through the real snowplow. Empty/absent
  # = feature OFF (v1 source-only preview drawer). Do NOT set this by hand when
  # previewSandbox.enabled is true: the chart then overrides this key in the rendered
  # config.json with previewSandbox.namespace, so config and provisioning cannot drift.
  PREVIEW_SANDBOX_NAMESPACE: ""
  # Autopilot builder publish DESTINATIONS — the "owner/repo" slug each authoring builder publishes
  # against. Config-driven so an org/repo rename is an install-values change, NOT a frontend image
  # rebuild (the krateo org migration braghettos → krateo-platformops proved that). The frontend has
  # NO hardcoded fallback repo: these are the ONLY source of the default destination (plus the human's
  # confirmation at publish). Absent/malformed → an empty prefill; the human supplies the destination.
  # A model-emitted owner/repo still wins over the prefill.
  #
  # PAGE — PER-ARTIFACT since #277: a page set is its own chart, so each one gets its OWN repo named
  #   for the page slug. The OWNER segment is what matters (the org new page-set repos land in); the
  #   REPO segment is only a placeholder prefill the page slug overrides.
  AUTOPILOT_PAGE_BUILDER_REPO: krateo-platformops/portal
  # PAGE TEMPLATE — the repo a NEW page-set repository is SEEDED from, before the composed chart is
  #   committed into it. builder-publish creates the destination repo and auto-inits it, so without
  #   this a composed page set lands in a bare repo: a valid chart with no release workflow and no
  #   compositiondefinition.yaml, and therefore no way to release or register itself. The template's
  #   .krateoignore keeps its own example chart out of the copy, so the composed chart is the only
  #   chart in the new repo. Empty = no seeding (the pre-#277 behaviour).
  AUTOPILOT_PAGE_BUILDER_TEMPLATE: krateo-blueprints/portal-builder
  # BLUEPRINT / KOG(controller) — PER-ARTIFACT repos (#163): each blueprint / RestDefinition gets its
  #   OWN repo named for the artifact. Here the OWNER segment is what matters (the org new repos land
  #   in); the REPO segment is only a placeholder prefill that the per-artifact name overrides. The
  #   default SCM-agnostic path discriminates Portal-Builder listings by the krateo.io/builder LABEL,
  #   not the repo, so per-artifact repos are safe.
  # EMPTY ON PURPOSE. This shipped as `krateo-blueprints/blueprints`, which does not exist — the org
  # has 35 repositories and none by that name. The page and KOG defaults above/below are real; this
  # one was the outlier, so every install that did not override it had blueprint publishing that
  # could never complete. A default pointing nowhere is worse than none: `builderClaimPublish.ts`
  # already DENIES an empty destination with an actionable message naming this key, but a non-empty
  # one sails past that guard, renders a LocalResource per file, and fails as `authentication
  # required: invalid credentials` — git reports an absent-or-invisible repo as an auth error, so it
  # does not even read as a wrong address. Set it to a real owner/repo that already EXISTS: a
  # publish pushes a branch to an existing repository, it never creates one.
  AUTOPILOT_BLUEPRINT_BUILDER_REPO: ""
  AUTOPILOT_KOG_BUILDER_REPO: krateo-platformops/krateo-oas
  # PUBLISHING IS ALWAYS A BuilderPublish CLAIM. The builders' held files are committed by
  # git-provider LocalResources; the frontend never writes github.krateo.io GitRef / RepoContent /
  # PullRequest objects itself (the legacy GitHub PR path and its AUTOPILOT_PUBLISH_VIA_GIT_PROVIDER
  # switch were removed 2026-09-25). PullRequest and Repository still exist — the builder-publish
  # composition renders both, server-side.
  #
  # THE COMPOSITION OPENS THE CHANGE REQUEST ITSELF, from builder-publish 1.8.21. This comment
  # previously said "no PR is opened, the reviewer opens it via a host-aware deep link (Option A)",
  # which was true when written and is now false on a default install: pullRequest.create defaults
  # true and the frontend claim never sets the key. The deep link survives as the FALLBACK for
  # exactly two cases — pullRequest.create explicitly false, and an install below
  # github-provider-kog 0.3.0, where the chart's CRD-presence guard renders no PullRequest and the
  # publish degrades to branch-only.
  #
  # REQUIRES, per install: git-provider (git.krateo.io, mandatory component); the builder-publish
  # composition (ships with the portal chart); a git-provider-credentials secret + git.host on the
  # composition; and github-provider-kog — any version for Repository, >= 0.3.0 for PullRequest —
  # unless repository.create and pullRequest.create are BOTH false. Both default true.
  #
  # "SCM-agnostic" describes the COMMITS, which git-provider makes over plain git on any host. The
  # change-request step is github-only: a composition whose git.scm is anything else FAILS THE
  # RENDER unless pullRequest.create is set false. That is deliberate — a publish that silently
  # never opened its change request is the failure the hard error exists to prevent — but it means
  # the AUTOPILOT_GIT_SCM values below are not all equally complete paths today.
  # SCM flavour + host — drive the "Open pull/merge request" deep link + the source-citation URL
  # scheme (github | gitlab | bitbucket | ado). Default github.com; set for self-hosted / other SCMs.
  AUTOPILOT_GIT_SCM: github
  AUTOPILOT_GIT_HOST: github.com
  # Autopilot SPEAK-BACK — reads an answer aloud when the question was asked BY VOICE (a
  # composer draft made purely of dictated segments; one typed character and the turn is
  # silent). ON by default; set "off" to remove the feature and its rail-header control on
  # this install. Uses the BROWSER's speech synthesis with a LOCAL (on-device) voice only:
  # no request leaves the browser, no microphone is opened, no HTTPS is required, and a
  # machine with no local voice simply reports the feature unavailable rather than falling
  # back to a cloud voice that would ship the answer text to a voice vendor.
  AUTOPILOT_VOICE_SPEAK_BACK: "on"
  # Autopilot DICTATION — hold-to-speak into the rail's composer. ITS PRESENCE IS THE
  # ON/OFF SWITCH: empty (the default) and no microphone control renders at all. Set it to
  # the FULL absolute URL of an OpenAI-shaped /chat/completions on the agent gateway —
  # the dedicated guardrail-free /stt/v1 route once the platform ships it, otherwise
  # https://<gateway-host>/llm/v1/chat/completions. Nothing is derived or defaulted here
  # on purpose: the route is a platform decision, not a frontend one.
  #
  # BEFORE ENABLING, know what it does: dictated microphone audio is sent to GOOGLE VERTEX
  # AI (region "global" — no region guarantee), because the gateway's /llm/v1 backend is
  # Vertex regardless of any ModelConfig, INCLUDING on installs that have moved the agent
  # fleet to a local model. The audio is used only to produce text in the composer; only
  # the user pressing Send transmits anything to an agent. It also requires HTTPS on the
  # portal AND on every backend origin in config.json — a plain-HTTP portal is not a secure
  # context, so no microphone control appears no matter what this key says.
  AUTOPILOT_VOICE_TRANSCRIBE_URL: ""
  # The model that transcribes. Must be one the gateway routes to a backend accepting an
  # inline audio `file` part (a gemini-* model on the Vertex backend does).
  AUTOPILOT_VOICE_MODEL: gemini-3.8-flash
  # Where speak-back sends the answer text to be SPOKEN. Empty (the default) means the answer
  # is read by the BROWSER's own speechSynthesis, pinned to voices reporting localService:true
  # — a privacy requirement, since a remote browser voice ships the answer text to the voice
  # vendor, and also why that reading sounds the way it does and why speak-back is unavailable
  # outright on a machine with no local voice.
  #
  # PREREQUISITE, and it fails in a way that reads like a bug: the Cloud Text-to-Speech API must
  # be ENABLED on the GCP project the gateway authenticates to. Verified 2026-09-11 on
  # operations-dev-krateo-io: only aiplatform.googleapis.com is enabled, so every synthesize
  # would return 403 "Cloud Text-to-Speech API has not been used in project ... or it is
  # disabled" — through the gateway that surfaces as a failed route, not as a missing API.
  #   gcloud services enable texttospeech.googleapis.com --project=<project>
  #
  # Set it to the portal-origin /tts/v1 route (agentgateway-policies tts.enabled) to use Google
  # Cloud Text-to-Speech instead. The browser calls it with its OWN portal bearer and never
  # holds a Google credential — the gateway backend mints that. Cloud TTS is a RENDERER: it
  # speaks the string it is given, which is what keeps the spoken words identical to the
  # written ones. A generative speech model cannot promise that, so this must not be pointed
  # at one. Requires HTTPS on the portal, as the transcription URL above does.
  AUTOPILOT_VOICE_TTS_URL: ""
  # The Cloud TTS voice. Only consulted when AUTOPILOT_VOICE_TTS_URL is set.
  AUTOPILOT_VOICE_NAME: en-US-Chirp3-HD-Achernar

# ── Preview sandbox (portal-builder live preview; w4 spec Addendum A) ─────────
# Provisions the quarantined namespace where the portal-builder applies DRAFT
# widget/RESTAction CRs so the REAL deployed snowplow compiles+serves them for
# the in-drawer live preview (previewPage v2). Default OFF: zero artifacts are
# rendered and config.json ships an empty PREVIEW_SANDBOX_NAMESPACE (the
# frontend keeps the v1 source-only drawer).
previewSandbox:
  enabled: false
  # The sandbox namespace: DURABLE chart-owned infra (quota + author RBAC +
  # live in it); only the draft CRs churn. Deliberately outside every
  # composition's render target, so drafts can never orphan a Helm release.
  namespace: krateo-preview
  # Draft time-to-live: stamped on the namespace as the krateo.io/ttl label and
  # Per-kind object-count quota. Kubernetes has NO aggregate object count across
  # a CRD group, so one count/<plural>.<group> entry is generated per widget
  # plural listed below (modest defaults: runaway-agent bound, not capacity).
  quota:
    perWidgetKind: 200
    restactions: 50
  # The widget plurals (group widgets.templates.krateo.io) — mirrors the 43 CRDs
  # in crds-subchart/templates. Drives the generated quota entries and the
  # quota. A NEW widget kind => append its plural here (the author Role
  # needs no change: it grants the whole group via resource wildcard '*').
  widgetPlurals:
    - alerts
    - badges
    - barcharts
    - breadcrumbs
    - buttongroups
    - buttons
    - cards
    - checkboxes
    - cols
    - datepickers
    - descriptions
    - dividers
    - filters
    - flexes
    - flowcharts
    - forms
    - images
    - inputnumbers
    - inputs
    - layouts
    - linecharts
    - listies
    - markdowns
    - menus
    - paragraphs
    - piecharts
    - progresses
    - qrcodes
    - radios
    - rangepickers
    - results
    - rows
    - selects
    - sliders
    - statistics
    - steps
    - switches
    - tables
    - tabs
    - tags
    - themes
    - uploads
    - yamlviewers
  # RoleBinding subjects granted author rights (full CRUD on widget CRs and
  # restactions) INSIDE the sandbox namespace only. Non-admin cohorts are
  # fail-closed without an entry here (verified live: snowplow skips cohorts
  # with no binding — prototype A.1.4). Default: the admins group.
  authors:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: admins
