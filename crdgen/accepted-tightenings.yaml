# Tightenings a human has reviewed and accepted, each with the measurement that justified it.
#
# WHY THIS FILE EXISTS. A gate with no way to record a reviewed exception has two futures and both
# are bad: it blocks legitimate work forever, or somebody deletes it. Neither is a gate. So an
# exception is possible — and it costs a declaration that names the finding, the reason, and the
# EVIDENCE, because "we decided it was fine" is the sentence that made 1.8.20 shippable.
#
# WHAT AN ENTRY IS NOT. It is not a mute button. `path` and `clause` must both match, so an entry
# accepts one kind of narrowing at one place; a second, different tightening at the same path still
# fails. And an entry that matches NOTHING is itself a finding — otherwise acceptances accumulate
# and silently widen as the schemas move underneath them.
#
# `path` is matched literally, or as a prefix when it ends in `*`.
# `clause` is the first word of the finding: required / enum / type / format / bounds / pattern /
#   properties / preserve-unknown.

- path: "*"
  pathSuffix: ".spec.widgetData.allowedResources[]"
  clause: enum
  accepted: 2026-11-04
  reason: >-
    `allowedResources` gains a VOCABULARY enum: every real widget plural, plus three plurals that
    name retired kinds which live CRs still carry. It refuses a typo (`buton`), a non-widget kind
    (`deployments`), and any retired plural the census did not see. The per-instance containment policy it does NOT express
    stays where it was — each container CR declares what its own slot is for, checked against its
    real children by design rule X5.
  evidence: >-
    Measured across four clusters (krateo-057, krateo-demo, krateo-demo-alpitour,
    krateo-installer-release) before shipping: 30 distinct values are live in that field and the
    vocabulary rejects 0 of them. Control, because a zero otherwise proves nothing: the same
    vocabulary rejects `buton`, `deployments`, `Flex`, `flex` and the empty string. The three
    retired plurals (`navmenuitems`, `pages`, `panels`) are included FOR this reason — excluding
    them would make specific live CRs unappliable on their next write, which is the 1.8.20 shape.
    Four clusters is a floor and not the population: a retired plural none of them carried would
    be refused on its next write on a cluster outside the census. Re-take it against the release
    actually cut.

- path: "*"
  pathSuffix: ".spec.resourcesRefsTemplate[].template"
  clause: required
  accepted: 2026-11-05
  reason: >-
    #612 requires `id` on a resourcesRefsTemplate template. It is in frontend-crds 1.8.22, which
    installer's main pins and no release has rolled, so the released pin still reads 1.8.21 and this
    is a live tightening until that changes. Without an id the frontend cannot resolve the ref.
  evidence: >-
    Measured on krateo-057 only: 683 widget CRs, 29 with a resourcesRefsTemplate, 36 entries, 0
    missing `id`. Control: the same scan found all 36 ids (Button/alert-detail-delete has
    delete-alert). The installer session reached the same count independently, on 057. Demo,
    alpitour and installer-release were NOT measured for this field, so this evidence covers one
    cluster.
