# Tightenings a human has reviewed and accepted, each with the measurement that justified it.
#
# WHY THIS FILE EXISTS. A gate with no way to record a reviewed exception has two futures and both
# are bad: it blocks legitimate work forever, or somebody deletes it. Neither is a gate. So an
# exception is possible — and it costs a declaration that names the finding, the reason, and the
# EVIDENCE, because "we decided it was fine" is the sentence that made 1.8.20 shippable.
#
# WHAT AN ENTRY IS NOT. It is not a mute button. `path` and `clause` must both match, so an entry
# accepts one kind of narrowing at one place; a second, different tightening at the same path still
# fails. And an entry that matches NOTHING is itself a finding — otherwise acceptances accumulate
# and silently widen as the schemas move underneath them.
#
# `path` is matched literally, or as a prefix when it ends in `*`.
# `clause` is the first word of the finding: required / enum / type / format / bounds / pattern /
#   properties / preserve-unknown.

- path: "*"
  pathSuffix: ".spec.widgetData.allowedResources[]"
  clause: enum
  accepted: 2026-11-05
  reason: >-
    `allowedResources` carries a kind-level enum, by role (ui/scripts/containment.ts). General
    layouts take every widget plural, including the ten retired ones, except `layouts` and `themes`.
    Purpose-built kinds take what they exist for. It refuses a typo (`buton`), a non-widget kind
    (`deployments`) and a kind that container has no use for. What each CR is for stays its own
    declaration, checked against its real children by design rule X5.
  evidence: >-
    Measured against the published 54-value vocabulary: 326 values on krateo-057, 61 on alpitour,
    298 on demo and 335 in portal main, none outside it. Per kind, 1402 live objects on krateo-057
    and alpitour, demo, and 619 rendered portal widgets fit these lists: nothing declared falls
    outside them. Card holds 15 child kinds while declaring 7, so children were read as well as
    declarations. Control, because a zero otherwise proves nothing: the same census finds `cards`
    and `panels`. WHAT THIS DOES NOT PROVE: every Table declares `[]`, no Form or Filters sets the
    field, and no ButtonGroup exists on these clusters, so those four lists rest on the design and
    the repo's examples, not on live use. That census is a floor and not the population, so re-take
    it against the release actually cut.

- path: "breadcrumbs.widgets.templates.krateo.io/v1beta1.spec.widgetData"
  clause: properties
  accepted: 2026-11-05
  reason: >-
    `allowedResources` removed: a Breadcrumb's `items` are plain data and it resolves no children, so
    a declaration on it could only mislead.
  evidence: >-
    0 Breadcrumb objects on krateo-057 and on demo, where the CRD is served, and alpitour serves no
    such kind. Control: the same walk finds the field on 93 of 93 Flexes on demo.

- path: "descriptions.widgets.templates.krateo.io/v1beta1.spec.widgetData"
  clause: properties
  accepted: 2026-11-05
  reason: >-
    `allowedResources` removed: a Descriptions' `items` are label/value pairs and it resolves no
    children, so a declaration on it could only mislead.
  evidence: >-
    0 of 16 Descriptions on krateo-057 and 0 of 16 on demo set the field, and alpitour serves no such
    kind. Control: the same walk finds the field on 93 of 93 Flexes on demo.
